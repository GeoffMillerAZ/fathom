# Git hooks for app-kit. Install once:  lefthook install
# Fathom checks static plan claims; quality-evidence also executes the bounded
# readiness/receipt checks after final source and documentation edits (INC-57).
# decision-index executes dual-register/MCP-range consistency (INC-58).

# fathom pre-push gate (done means proven): every claimed [x] plan row must
# verify against the index. Fail-open on exit 2 (daemon down / not indexed)
# — an operational error is not a verdict on the plan. LOUD on a missing
# binary: a gate that cannot run must fail, not pass.
pre-push:
  commands:
    decision-index:
      run: go test ./cmd/appkit-mcp -run '^TestDecisionsIndexCoversEveryADR$' -count=1
    quality-evidence:
      run: go test ./internal/qualityplan -run '^(TestInventoryCompilesAndTracksIndependentFacts|TestJITContributionPathRehearsal)$' -count=1
    fathom-verify:
      run: |
        command -v fathom >/dev/null 2>&1 || { echo "fathom missing — verify gate NOT run"; exit 1; }
        rc=0
        for p in docs/plans/*.md; do
          case "$(basename "$p")" in README.md) continue;; esac
          fathom verify --service app-kit --plan "$p"; c=$?
          if [ "$c" -eq 1 ]; then rc=1; elif [ "$c" -eq 2 ]; then echo "fathom verify: operational error — allowing push (fail-open): $p"; fi
        done
        exit $rc
