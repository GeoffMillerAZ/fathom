# Shared CSS tasks — included by the kit root and by every scaffolded app.
# The Tailwind binary is the checksum-pinned standalone (D2: no Node);
# `appkit css` fetches + verifies + runs it. Apps set INPUT/OUTPUT vars.
version: "3"

vars:
  INPUT: '{{.INPUT | default "assets/input.css"}}'
  OUTPUT: '{{.OUTPUT | default "assets/app.css"}}'

tasks:
  build:
    desc: Build CSS once (minified)
    cmds:
      - go run github.com/geoffmilleraz/app-kit/cmd/appkit css -i {{.INPUT}} -o {{.OUTPUT}} --minify

  watch:
    desc: Rebuild CSS on change
    cmds:
      - go run github.com/geoffmilleraz/app-kit/cmd/appkit css -i {{.INPUT}} -o {{.OUTPUT}} --watch
