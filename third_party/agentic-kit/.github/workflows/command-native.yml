# Additive observations, not a replacement for CI/task validate. Each receipt
# qualifies its fixed profile on the actual hosted OS/architecture only.
name: Command native observations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Conservative transitive Go input coverage avoids stale native receipts
      # when a shared parser/evaluator changes without a command-local edit.
      - '**/*.go'
      - go.mod
      - cmd/command-guard/**
      - cmd/command-qualify/**
      - .github/workflows/command-native.yml

permissions:
  contents: read

jobs:
  files-observation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [files-core/1, files-loopback-fixture/1]
        include:
          - os: ubuntu-latest
            profile: files-core/1
            artifact: core
          - os: ubuntu-latest
            profile: files-loopback-fixture/1
            artifact: loopback-fixture
          - os: macos-latest
            profile: files-core/1
            artifact: core
          - os: macos-latest
            profile: files-loopback-fixture/1
            artifact: loopback-fixture
          - os: windows-latest
            profile: files-core/1
            artifact: core
          - os: windows-latest
            profile: files-loopback-fixture/1
            artifact: loopback-fixture
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      NQ_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # stdlib-only module; no go.sum/module cache to restore
      - name: Build and observe Unix host
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nq-output"
          if [ "$NQ_PROFILE" = files-loopback-fixture/1 ]; then
            go build -tags command_classifier -o "$RUNNER_TEMP/command-guard" ./cmd/command-guard
          else
            go build -o "$RUNNER_TEMP/command-guard" ./cmd/command-guard
          fi
          go build -o "$RUNNER_TEMP/command-qualify" ./cmd/command-qualify
          if [ "$NQ_PROFILE" = files-loopback-fixture/1 ] && [ "$RUNNER_OS" = Linux ]; then
            go test -race -tags command_classifier ./cmd/command-guard ./cmd/command-qualify
            go vet -tags command_classifier ./cmd/command-guard ./cmd/command-qualify
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            guard_hash=$(shasum -a 256 "$RUNNER_TEMP/command-guard" | cut -d ' ' -f 1)
            runner_hash=$(shasum -a 256 "$RUNNER_TEMP/command-qualify" | cut -d ' ' -f 1)
          else
            guard_hash=$(sha256sum "$RUNNER_TEMP/command-guard" | cut -d ' ' -f 1)
            runner_hash=$(sha256sum "$RUNNER_TEMP/command-qualify" | cut -d ' ' -f 1)
          fi
          printf '{"sourceRevision":"%s","runnerSHA256":"%s","kind":"hosted-build-observation"}\n' "$GITHUB_SHA" "$runner_hash" > "$RUNNER_TEMP/nq-output/source.json"
          "$RUNNER_TEMP/command-qualify" run --profile "$NQ_PROFILE" --guard "$RUNNER_TEMP/command-guard" --guard-sha256 "$guard_hash" --format json > "$RUNNER_TEMP/nq-output/receipt.json"
      - name: Build and observe Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'nq-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $guard = Join-Path $env:RUNNER_TEMP 'command-guard.exe'
          $runner = Join-Path $env:RUNNER_TEMP 'command-qualify.exe'
          if ($env:NQ_PROFILE -eq 'files-loopback-fixture/1') {
            go build -tags command_classifier -o $guard ./cmd/command-guard
          } else {
            go build -o $guard ./cmd/command-guard
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o $runner ./cmd/command-qualify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $guardHash = (Get-FileHash -Algorithm SHA256 $guard).Hash.ToLowerInvariant()
          $runnerHash = (Get-FileHash -Algorithm SHA256 $runner).Hash.ToLowerInvariant()
          @{sourceRevision=$env:GITHUB_SHA; runnerSHA256=$runnerHash; kind='hosted-build-observation'} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 (Join-Path $output 'source.json')
          $receipt = & $runner run --profile $env:NQ_PROFILE --guard $guard --guard-sha256 $guardHash --format json
          $runExit = $LASTEXITCODE
          $receipt | Set-Content -Encoding utf8 (Join-Path $output 'receipt.json')
          exit $runExit
      - name: Retain sanitized receipts, including failed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-native-${{ matrix.os }}-${{ matrix.artifact }}
          path: ${{ runner.temp }}/nq-output/*.json
          if-no-files-found: error
          retention-days: 14
