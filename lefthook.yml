# Two-layer git hooks (see ADR + agentic-kit precedent):
#   pre-commit (fast) — changed-file gofmt + cue vet
#   pre-push   (full) — task validate
# Opt out with LEFTHOOK=0 — never `--no-verify` unless the hook itself is broken.

pre-commit:
  parallel: true
  commands:
    go-fmt-check:
      glob: "*.go"
      run: |
        files=$(printf '%s\n' {staged_files} | grep -v '/_reference/' || true)
        [ -z "$files" ] && exit 0
        bad=$(echo "$files" | xargs gofmt -l)
        if [ -n "$bad" ]; then echo "gofmt needed:"; echo "$bad"; exit 1; fi
    cue-vet:
      glob: "*.cue"
      run: |
        command -v cue >/dev/null 2>&1 || exit 0
        dirs=$(printf '%s\n' {staged_files} | grep -vE '/cue.mod/|/testdata/|/ref/' | xargs -n1 dirname 2>/dev/null | sort -u)
        for d in $dirs; do
          [ -f "$d/schema.cue" ] || continue
          (cd "$d" && cue vet ./...) || exit 1
        done

pre-push:
  commands:
    validate:
      run: task validate
    # fathom verify gate — §5.1 + §5.3 of docs/design/coding-agent-excellence.md:
    # gating only [x] claimed tasks in docs/plans/*.md.
    # exit 1 (claimed task unproven) → BLOCK push.
    # exit 2 (daemon down / plan unreadable) → warn and ALLOW push (fail-open).
    #
    # Scope (E4-2, docs/plans/new-use-cases.md): ACTIVE plans only. The glob
    # "docs/plans/*.md" is intentionally non-recursive (no `shopt -s
    # globstar`) — it never descends into docs/plans/archive/, so a plan
    # `fathom plans archive`d there stops costing a verify invocation on
    # every push without any extra exclusion logic. Do not switch this to a
    # recursive glob without re-adding an explicit archive/ exclusion.
    verify:
      run: |
        [ -x bin/fathom ] || exit 0
        shopt -s nullglob
        plans=()
        for f in docs/plans/*.md; do
          [ "$(basename "$f")" = "README.md" ] && continue  # READMEs describe, plans claim
          plans+=("$f")
        done
        [ ${#plans[@]} -eq 0 ] && exit 0
        rc=0
        for f in "${plans[@]}"; do
          bin/fathom verify --service fathom --plan "$f"
          code=$?
          if [ $code -eq 1 ]; then rc=1; fi
          if [ $code -eq 2 ]; then
            echo "fathom verify: operational error — allowing push (fail-open, see docs/design/coding-agent-excellence.md §5.3)"
          fi
        done
        exit $rc
    # fathom review — C3-1, the forced channel (docs/plans/review-verb.md):
    # a NON-BLOCKING `fathom review --since origin/main` SUMMARY printed on
    # every push — and truthfully only a summary: --no-persist means this
    # hook never writes to the shared claims store (persisting review
    # findings is a deliberate act for direct CLI / MCP use, never a hook
    # side effect). Unlike verify above, a review finding is advisory, not
    # gating: this step ALWAYS exits 0, whatever bin/fathom review itself
    # returns. Operational errors (no bin/fathom, unreachable ref, unindexed
    # service, corrupt store) degrade silently to a single line — never a
    # blocking failure and never a raw error dump (fail-open convention,
    # docs/design/coding-agent-excellence.md §5.3). --store points at the
    # same workspace/db/fleet.sqlite the post-commit fathom-refresh step
    # below keeps current, so the summary reflects the just-committed state
    # without a daemon round trip. Latency: measured 22.6s on a SIX-file
    # diff (2026-08-07, O9) — and lefthook buffers step output, so an
    # unbounded slow review is indistinguishable from a hang to whoever is
    # watching the push (scripted pushes were killed at 60-90s caps for
    # exactly this). --budget-seconds 20 bounds it: on excess the step
    # prints a named advisory skip and exits 0. This BOUNDS the advisory
    # channel; it does not weaken a gate — review always exited 0 here.
    review:
      run: |
        [ -x bin/fathom ] || exit 0
        out=$(bin/fathom review --service fathom --since origin/main --store workspace/db/fleet.sqlite --no-persist --budget-seconds 20 2>&1)
        if [ $? -ne 0 ]; then
          echo "fathom review: operational error — skipped (fail-open, see docs/design/coding-agent-excellence.md §5.3)"
          exit 0
        fi
        echo "$out"
        exit 0

# Best-effort post-commit upkeep.
#  1. rebuild-binary — when a commit touched Go source, rebuild bin/fathom so the
#     on-disk binary tracks HEAD. Without this, a query-engine fix is committed but
#     bin/fathom stays stale for days and every consumer serves old logic (the
#     2026-06 staleness finding — docs/dogfood-observations.md). A failed rebuild
#     is REPORTED, never silent: a silently-stale binary is exactly the failure
#     this hook exists to prevent (2026-07-22: the rebuild failed silently for
#     days on a full disk and nothing said so). Note the daemon runs an
#     INSTALLED copy, not bin/fathom — deploying is a deliberate step (see
#     docs/configuration.md).
#  2. fathom-refresh — re-index fathom into the fleet store with the fresh
#     binary. --path must be ABSOLUTE: the recorded ServiceMeta path is what
#     the daemon resolves on auto-refresh. Concurrent daemon writes are fine
#     on the SQLite WAL store (ADR-020); errors stay non-blocking.
post-commit:
  commands:
    rebuild-binary:
      run: |
        git diff-tree --no-commit-id --name-only -r HEAD | grep -q '\.go$' || exit 0
        if ! go build -o bin/fathom ./cmd/fathom >/dev/null 2>&1; then
          echo "post-commit: bin/fathom rebuild FAILED — the binary is now STALE vs HEAD." >&2
          echo "  disk-full class? retry with an external build tmp:  GOTMPDIR=<big-disk>/tmp/gobuild TMPDIR=<big-disk>/tmp/gobuild go build -o bin/fathom ./cmd/fathom  (BOTH vars: the linker/dsymutil write to TMPDIR)" >&2
        fi
    fathom-refresh:
      run: |
        [ -x bin/fathom ] || exit 0
        bin/fathom ingest --service fathom --path "$PWD" --store workspace/db/fleet.sqlite >/dev/null 2>&1 || true
