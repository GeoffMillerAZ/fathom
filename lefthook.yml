# Two-layer git hooks (see ADR + agentic-kit precedent):
#   pre-commit (fast) — changed-file gofmt + cue vet
#   pre-push   (full) — task validate
# Opt out with LEFTHOOK=0 — never `--no-verify` unless the hook itself is broken.

pre-commit:
  parallel: true
  commands:
    go-fmt-check:
      glob: "*.go"
      run: |
        files=$(printf '%s\n' {staged_files} | grep -v '/_reference/' || true)
        [ -z "$files" ] && exit 0
        bad=$(echo "$files" | xargs gofmt -l)
        if [ -n "$bad" ]; then echo "gofmt needed:"; echo "$bad"; exit 1; fi
    cue-vet:
      glob: "*.cue"
      run: |
        command -v cue >/dev/null 2>&1 || exit 0
        dirs=$(printf '%s\n' {staged_files} | grep -vE '/cue.mod/|/testdata/|/ref/' | xargs -n1 dirname 2>/dev/null | sort -u)
        for d in $dirs; do
          [ -f "$d/schema.cue" ] || continue
          (cd "$d" && cue vet ./...) || exit 1
        done

pre-push:
  commands:
    # EW (tag-only push): validate and verify skip when no commit is new to
    # the remote (scripts/prepush-refs.sh). The verify step below is the one
    # command that reads stdin (lefthook 1.13.6 deadlocks with two
    # `use_stdin: true` commands) and runs first (priority 1); it leaves the
    # verdict validate asks for here.
    validate:
      run: |
        if bash scripts/prepush-refs.sh skipped; then
          echo "pre-push: validate skipped — no commit is new to the remote"
          exit 0
        fi
        task validate
    # fathom verify gate — §5.1 + §5.3 of docs/design/coding-agent-excellence.md:
    # gating only [x] claimed tasks in docs/plans/*.md.
    # exit 1 (claimed task unproven, or claimed and Unknown under --strict —
    # futures F10, promoted 2026-09-25) → BLOCK push.
    # exit 2 (daemon down / plan unreadable) → warn and ALLOW push (fail-open).
    #
    # Scope (E4-2, docs/plans/new-use-cases.md): ACTIVE plans only. The glob
    # "docs/plans/*.md" is intentionally non-recursive (no `shopt -s
    # globstar`) — it never descends into docs/plans/archive/, so a plan
    # `fathom plans archive`d there stops costing a verify invocation on
    # every push without any extra exclusion logic. Do not switch this to a
    # recursive glob without re-adding an explicit archive/ exclusion.
    # INC-21 (2026-09-19): the gate verifies THE TREE BEING PUSHED. The daemon's
    # store indexes the operator's checkout, which can lag the push clone by a
    # whole round, so verifying claimed rows against it reported "25 claimed:
    # 0 verified" for symbols that only exist in the pushed tree. The step now
    # ingests HEAD into a scratch store under workspace/tmp (gitignored) and
    # verifies against that; an ingest failure is an operational error
    # (fail-open with a named line), never a silent pass.
    # RT-129 (§12.3): the scratch ingest and each verify run under the same
    # machine-wide gate lease and background priority as `task validate`
    # (scripts/gate-lease.sh), so concurrent pushes queue rather than
    # ingest side by side.
    # Push 79 (ADR-018 note 2026-09-29, I45): verify reads the change range,
    # `--since <base>`, so a `library: true` or `skip_test` waiver added in
    # the same range as the claim it excuses is self-declared and refused.
    # Not retroactive: a waiver already on the remote predates every later
    # range. Exit 2 stays fail-open.
    # EW-16: <base> is the remote sha git hands the hook on stdin (lefthook
    # `use_stdin: true`: "<local ref> <local sha> <remote ref> <remote sha>"
    # per pushed ref), the ref this push replaces, so a stale local
    # origin/main (a push clone whose origin is a local checkout that has not
    # fetched) neither blocks a legitimate push nor widens the range. The
    # ref pushing HEAD names the base; `git merge-base <remote sha> HEAD`
    # makes a force push read from its fork point. No usable remote sha (a
    # new branch's all-zero sha, a sha this clone does not hold, a
    # delete-only push, stdin from a terminal or absent) falls back to
    # `git merge-base HEAD origin/main` and says why; no merge-base either
    # (no origin/main ref, a shallow clone) runs verify without --since and
    # says so. A block names the base it read. The body runs under macOS's
    # bash 3.2 (no ${x,,}, no mapfile, no empty-array expansion under set -u).
    verify:
      priority: 1
      use_stdin: true
      run: |
        refs=""
        if [ ! -t 0 ]; then refs=$(cat); fi
        # A push that carries no new commit (a tag already on the remote, a
        # delete) skips verify, and leaves the same verdict for validate. Only the
        # remote pushed to ({1}, the name git hands pre-push) vouches for a tag.
        if [ -n "$refs" ] && [ -f scripts/prepush-refs.sh ] && printf '%s\n' "$refs" | bash scripts/prepush-refs.sh decide "{1}"; then
          exit 0
        fi
        [ -x bin/fathom ] || exit 0
        lease="bash scripts/gate-lease.sh"
        shopt -s nullglob
        plans=()
        for f in docs/plans/*.md; do
          [ "$(basename "$f")" = "README.md" ] && continue  # READMEs describe, plans claim
          plans+=("$f")
        done
        [ ${#plans[@]} -eq 0 ] && exit 0
        mkdir -p workspace/tmp
        store="workspace/tmp/gate-verify.sqlite"
        rm -f "$store" "$store-wal" "$store-shm"
        if ! $lease bin/fathom ingest --store "$store" --service fathom --path . >workspace/tmp/gate-verify-ingest.log 2>&1; then
          echo "fathom verify: scratch ingest of HEAD failed — allowing push (fail-open, see workspace/tmp/gate-verify-ingest.log)"
          exit 0
        fi
        since=()
        base=""
        range_from=""
        remote_sha=""
        new_branch=""
        if [ -n "$refs" ]; then
          head_sha=$(git rev-parse HEAD 2>/dev/null)
          while read -r _lref lsha _rref rsha; do
            [ -n "$lsha" ] || continue
            [ -n "${lsha//0/}" ] || continue # an all-zero local sha deletes a ref: nothing to verify
            if [ "$lsha" = "$head_sha" ] || [ -z "$remote_sha$new_branch" ]; then
              if [ -z "${rsha//0/}" ]; then remote_sha=""; new_branch=1; else remote_sha="$rsha"; new_branch=""; fi
            fi
          done <<<"$refs"
        fi
        if [ -n "$remote_sha" ]; then
          if git cat-file -e "$remote_sha^{commit}" 2>/dev/null && base=$(git merge-base "$remote_sha" HEAD 2>/dev/null) && [ -n "$base" ]; then
            range_from="the remote sha this push replaces"
          else
            base=""
            echo "fathom verify: the remote sha $remote_sha is not a commit in this clone (fetch first) — falling back to the merge-base with origin/main"
          fi
        elif [ -n "$new_branch" ]; then
          echo "fathom verify: a new branch has no remote sha — reading the range from the merge-base with origin/main"
        fi
        if [ -z "$base" ]; then
          if base=$(git merge-base HEAD origin/main 2>/dev/null) && [ -n "$base" ]; then
            range_from="merge-base with origin/main"
          else
            base=""
            echo "fathom verify: no merge-base with origin/main — verifying without --since (a waiver added in this push is not checked for self-declaration)"
          fi
        fi
        [ -z "$base" ] || since=(--since "$base")
        rc=0
        for f in "${plans[@]}"; do
          $lease bin/fathom verify --strict "${since[@]}" --store "$store" --service fathom --plan "$f" --quiet
          code=$?
          if [ $code -eq 1 ]; then rc=1; fi
          if [ $code -eq 2 ]; then
            echo "fathom verify: operational error — allowing push (fail-open, see docs/design/coding-agent-excellence.md §5.3)"
          fi
        done
        if [ $rc -eq 1 ] && [ ${#since[@]} -gt 0 ]; then
          if [ "$range_from" = "merge-base with origin/main" ]; then
            echo "fathom verify: the range was read from $base ($range_from); if origin/main is stale, a waiver already on the remote reads self-declared — fetch main into origin/main and retry"
          else
            echo "fathom verify: the range was read from $base ($range_from); a waiver added in $base..HEAD reads self-declared"
          fi
        fi
        exit $rc
    # fathom review — C3-1, the forced channel (docs/plans/review-verb.md):
    # a NON-BLOCKING `fathom review --since origin/main` SUMMARY printed on
    # every push — and truthfully only a summary: --no-persist means this
    # hook never writes to the shared claims store (persisting review
    # findings is a deliberate act for direct CLI / MCP use, never a hook
    # side effect). Unlike verify above, a review finding is advisory, not
    # gating: this step ALWAYS exits 0, whatever bin/fathom review itself
    # returns. Operational errors (no bin/fathom, unreachable ref, unindexed
    # service, corrupt store) degrade silently to a single line — never a
    # blocking failure and never a raw error dump (fail-open convention,
    # docs/design/coding-agent-excellence.md §5.3). --store points at the
    # same workspace/db/fleet.sqlite the post-commit fathom-refresh step
    # below keeps current, so the summary reflects the just-committed state
    # without a daemon round trip. Latency: measured 22.6s on a SIX-file
    # diff (2026-08-07, O9) — and lefthook buffers step output, so an
    # unbounded slow review is indistinguishable from a hang to whoever is
    # watching the push (scripted pushes were killed at 60-90s caps for
    # exactly this). --budget-seconds 20 bounds it: on excess the step
    # prints a named advisory skip and exits 0. This BOUNDS the advisory
    # channel; it does not weaken a gate — review always exited 0 here.
    review:
      run: |
        [ -x bin/fathom ] || exit 0
        out=$(bin/fathom review --service fathom --since origin/main --store workspace/db/fleet.sqlite --no-persist --budget-seconds 20 2>&1)
        if [ $? -ne 0 ]; then
          echo "fathom review: operational error — skipped (fail-open, see docs/design/coding-agent-excellence.md §5.3)"
          exit 0
        fi
        echo "$out"
        exit 0
    # fathom conserve — ADR-044 §6/CV-47: the refactor-conservation
    # summary printed on every push, advisory for every plane EXCEPT one
    # finding: `--strict-plane integrity` (PR-9, ADR-057's PR-8 decision,
    # accepted by the owner 2026-09-29) exits 1 on a SILENT pin loss — a
    # test a governing source names (an invariant's enforcement column, a
    # tests/*.cue manifest entry, a scope evidence line, a certifies
    # marker, a guard note's done needs), lost in the pushed range while
    # that source still names it at head — and (PR-12, ADR-057's K4 clause,
    # O161) on a retired pin (its source was edited in the range to drop
    # the name) that no decision in the range names: a line added in
    # ADR.md, docs/adr/** or docs/intent/decisions/**, or a dated decision
    # line, naming the test; a docs/plans row never counts. Only a cited
    # retirement is printed for review and passes. Exit 1 passes through and
    # blocks the push; everything else stays warning-only. --since prefers
    # the branch's own upstream (`@{u}`) so a feature branch conserves
    # against what it will actually merge into, falling back to
    # `origin/main` when there is no upstream yet (a brand-new branch, a
    # fresh clone that never pushed). A missing bin/fathom or any other
    # non-zero exit (2: an unresolvable ref, an unreadable input) degrades
    # to a single fail-open line, never a blocking failure
    # (docs/design/coding-agent-excellence.md §5.3).
    refactor-conserve:
      run: |
        [ -x bin/fathom ] || exit 0
        since=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null)
        [ -n "$since" ] || since="origin/main"
        out=$(bin/fathom conserve --service fathom --since "$since" --store workspace/db/fleet.sqlite --strict-plane integrity 2>&1)
        rc=$?
        if [ $rc -eq 1 ]; then
          echo "$out"
          echo "fathom conserve: a silent pin loss or an uncited retirement blocks this push (ADR-057, PR-9, PR-12)"
          exit 1
        fi
        if [ $rc -ne 0 ]; then
          echo "fathom conserve: operational error — skipped (fail-open, see docs/design/coding-agent-excellence.md §5.3)"
          exit 0
        fi
        echo "$out"
        exit 0

# Best-effort post-commit upkeep.
#  1. rebuild-binary — when a commit touched Go source, rebuild bin/fathom so the
#     on-disk binary tracks HEAD. Without this, a query-engine fix is committed but
#     bin/fathom stays stale for days and every consumer serves old logic (the
#     2026-06 staleness finding — docs/dogfood-observations.md). A failed rebuild
#     is REPORTED, never silent: a silently-stale binary is exactly the failure
#     this hook exists to prevent (2026-07-22: the rebuild failed silently for
#     days on a full disk and nothing said so). Note the daemon runs an
#     INSTALLED copy, not bin/fathom — deploying is a deliberate step (see
#     docs/configuration.md).
#  2. fathom-refresh — refresh the index THROUGH THE DAEMON (HF-2, INC-3).
#     This used to be a shell `fathom ingest --store workspace/db/fleet.sqlite`
#     against the very store the daemon serves: the write path O16 rode when a
#     wedged reader replaced a good index with a plausible empty one, and the
#     thing AGENTS.md's question-shape routing rule forbids. `post-commit-hook` calls the
#     daemon's ingest tool instead and falls back to the store-direct path only
#     when the daemon is unreachable — and there IT-15's refusal is in force.
#     Always exits 0; a commit is never blocked on a refresh.
post-commit:
  commands:
    rebuild-binary:
      run: |
        git diff-tree --no-commit-id --name-only -r HEAD | grep -q '\.go$' || exit 0
        if ! go build -o bin/fathom ./cmd/fathom >/dev/null 2>&1; then
          echo "post-commit: bin/fathom rebuild FAILED — the binary is now STALE vs HEAD." >&2
          echo "  disk-full class? retry with an external build tmp:  GOTMPDIR=<big-disk>/tmp/gobuild TMPDIR=<big-disk>/tmp/gobuild go build -o bin/fathom ./cmd/fathom  (BOTH vars: the linker/dsymutil write to TMPDIR)" >&2
        fi
    fathom-refresh:
      run: |
        [ -x bin/fathom ] || exit 0
        bin/fathom post-commit-hook --dir "$PWD" --service fathom --quiet || true
