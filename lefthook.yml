# Two-layer git hooks (see ADR + agentic-kit precedent):
#   pre-commit (fast) — changed-file gofmt + cue vet
#   pre-push   (full) — task validate
# Opt out with LEFTHOOK=0 — never `--no-verify` unless the hook itself is broken.

pre-commit:
  parallel: true
  commands:
    go-fmt-check:
      glob: "*.go"
      run: |
        files=$(printf '%s\n' {staged_files} | grep -v '/_reference/' || true)
        [ -z "$files" ] && exit 0
        bad=$(echo "$files" | xargs gofmt -l)
        if [ -n "$bad" ]; then echo "gofmt needed:"; echo "$bad"; exit 1; fi
    cue-vet:
      glob: "*.cue"
      run: |
        command -v cue >/dev/null 2>&1 || exit 0
        dirs=$(printf '%s\n' {staged_files} | grep -vE '/cue.mod/|/testdata/|/ref/' | xargs -n1 dirname 2>/dev/null | sort -u)
        for d in $dirs; do
          [ -f "$d/schema.cue" ] || continue
          (cd "$d" && cue vet ./...) || exit 1
        done

pre-push:
  commands:
    validate:
      run: task validate
    # fathom verify gate — §5.1 + §5.3 of docs/design/coding-agent-excellence.md:
    # gating only [x] claimed tasks in docs/plans/*.md.
    # exit 1 (claimed task unproven) → BLOCK push.
    # exit 2 (daemon down / plan unreadable) → warn and ALLOW push (fail-open).
    verify:
      run: |
        [ -x bin/fathom ] || exit 0
        shopt -s nullglob
        plans=()
        for f in docs/plans/*.md; do
          [ "$(basename "$f")" = "README.md" ] && continue  # READMEs describe, plans claim
          plans+=("$f")
        done
        [ ${#plans[@]} -eq 0 ] && exit 0
        rc=0
        for f in "${plans[@]}"; do
          bin/fathom verify --service fathom --plan "$f"
          code=$?
          if [ $code -eq 1 ]; then rc=1; fi
          if [ $code -eq 2 ]; then
            echo "fathom verify: operational error — allowing push (fail-open, see docs/design/coding-agent-excellence.md §5.3)"
          fi
        done
        exit $rc

# Best-effort post-commit upkeep.
#  1. rebuild-binary — when a commit touched Go source, rebuild bin/fathom so the
#     on-disk binary tracks HEAD. Without this, a query-engine fix is committed but
#     bin/fathom stays stale for days and every consumer serves old logic (the
#     2026-06 staleness finding — docs/dogfood-observations.md). A running serve-mcp
#     process still needs a restart to load the new binary; this keeps the binary
#     itself honest so the next start is current.
#  2. fathom-refresh — re-index fathom into the fleet store with the fresh binary.
#     Fails silently when a live MCP server holds the DuckDB write lock (sessions
#     refresh via the MCP `ingest` tool instead).
post-commit:
  commands:
    rebuild-binary:
      run: |
        git diff-tree --no-commit-id --name-only -r HEAD | grep -q '\.go$' || exit 0
        go build -o bin/fathom ./cmd/fathom >/dev/null 2>&1 || true
    fathom-refresh:
      run: |
        [ -x bin/fathom ] || exit 0
        bin/fathom ingest --service fathom --path . --store workspace/db/fleet.duckdb >/dev/null 2>&1 || true
