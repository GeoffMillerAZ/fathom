id: alertmanager
language: Alertmanager configuration
# Subjects for LB-Q-alertmanager (wave c3, item obs). Configurations:
# Alertmanager's own documentation examples and the test configurations its
# CLI and config package ship (read as a derived tree: cli/testdata and
# config/testdata copied to cli-testdata/ and config-testdata/, since the
# connector skips a testdata directory; the 26 amtool refuses are out).
# Routing: kube-prometheus' alertmanager-secret.yaml (its configuration
# derived by calibration/oracles/alertmanager -derive-embedded) with its
# PrometheusRule specs (derived by calibration/oracles/prometheus
# -derive-prometheusrules): 139 alerting rules routed through the tree. All are
# read only, never vendored.
repos:
  - name: prometheus/alertmanager
    url: https://github.com/prometheus/alertmanager.git
    ref: v0.34.1
    sha: 73c6bfe7393929211294c1954f30d8ed78e4d0ad
    licence: Apache-2.0
    sparse: ["doc/examples/**", "examples/ha/**", "cli/testdata/**", "config/testdata/**"]
    idioms:
      - "doc/examples/simple.yml: legacy match and match_re, continue, inhibit rules, every common receiver"
      - "config/testdata/conf.good.yml: time intervals, mute and active, http_config credentials"
  - name: prometheus-operator/kube-prometheus
    url: https://github.com/prometheus-operator/kube-prometheus.git
    ref: v0.19.0
    sha: 799f3d73b5adf5758c3119c9201d9f417accb6d0
    licence: Apache-2.0
    sparse: ["manifests/**"]
    idioms:
      - "manifests/alertmanager-secret.yaml: a configuration in a Secret's stringData, quoted keys, alertname and severity matchers, unquoted regex values"
      - "manifests/*-prometheusRule.yaml: 139 alerting rules whose static severity decides every routing"
