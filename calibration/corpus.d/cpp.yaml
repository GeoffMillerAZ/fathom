id: cpp
language: C++
# Measurement conventions (docs/bench/readings/lang/cpp.json): fmt is measured with
#   -only 'include/**,src/**,test/*.cc,test/*.h,test/fuzzing/**'
# (its bundled test/gtest is vendored code); both subjects' .h/.hpp headers are measured
# (lang-oracle routes .h through the header router's C++ sniff); nlohmann/json is measured
# with -only 'include/**' from the repository root (its `subpath: include`). scip-clang
# (calibration/oracles/scip-clang, LB-F79) indexes each subject's cmake compilation database:
#   cmake -S <subject> -B <scratch-build-dir> -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFMT_TEST=ON        (fmt: 51 entries)
#   cmake -S <subject> -B <scratch-build-dir> -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DJSON_BuildTests=ON (json: 93 entries, all tests/)
# The earlier readings used a hand-written one (fmt: src/format.cc, src/os.cc and a synthetic unit
# including every public header; json: one unit using json.hpp's API); they are not comparable.
# gabime/spdlog (2026-10-01, LB-F116) is measured with
#   -only 'include/spdlog/*.h,include/spdlog/cfg/**,include/spdlog/details/**,include/spdlog/sinks/**,src/**,tests/*.cpp,tests/*.h,example/**'
# (include/spdlog/fmt/** wraps or vendors fmt itself, measured as its own subject):
#   cmake -S <subject> -B <scratch-build-dir> -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSPDLOG_BUILD_EXAMPLE=ON -DSPDLOG_BUILD_TESTS=ON
# (configure fetches Catch2 v3.5.0 into the build dir; the compilation database is filtered to the
# 34 entries whose file is in the subject before scip-clang, preproc and clang-calls read it).
# Each subject's calls are also read against the build's own compiler (calibration/oracles/clang-calls).
repos:
  - name: fmtlib/fmt
    url: https://github.com/fmtlib/fmt
    ref: 12.2.0
    sha: 1be298e1bd68957e4cd352e1f676f00e07dcfb57
    licence: MIT
    idioms:
      - header-only-style class and function templates in a namespace whose name is a
        macro (FMT_BEGIN_NAMESPACE) around an inline versioned namespace
      - constexpr/noexcept function definitions behind FMT_CONSTEXPR-style macro
        decorators
      - SFINAE-constrained overloads (enable_if_t defaulted template parameters) and
        conversion operators
      - out-of-class member definitions of class templates (basic_memory_buffer) and
        friend functions defined in the class body
      - a `detail` sub-namespace of helper functions and a src/ tree of ordinary
        translation units
  - name: nlohmann/json
    url: https://github.com/nlohmann/json
    ref: v3.12.0
    sha: 55f93686c01528224f448c19128836e7df245f72
    licence: MIT
    subpath: include
    idioms:
      - one very large class template (basic_json) with dozens of nested class
        templates, iterators and serializers
      - macro-wrapped namespaces (NLOHMANN_JSON_NAMESPACE_BEGIN) with nested `detail`
        namespaces
      - operator overloads (operator==, operator<<, operator[], operator<=>) as members
        and as friends
      - function templates constrained by defaulted enable_if_t parameters and tag
        dispatch overloads
      - macro families generating definitions (NLOHMANN_DEFINE_TYPE_INTRUSIVE)
  - name: gabime/spdlog
    url: https://github.com/gabime/spdlog
    ref: v1.17.0
    sha: 79524ddd08a4ec981b7fea76afd08ee05f83755d
    licence: MIT
    idioms:
      - export and inline decorator macros on every declaration (class SPDLOG_API logger,
        SPDLOG_INLINE before out-of-line definitions in *-inl.h, SPDLOG_NOEXCEPT after them)
      - a header-only or compiled library from the same headers (SPDLOG_HEADER_ONLY,
        src/*.cpp including the -inl.h files)
      - variadic member function templates forwarding to fmt (logger::log<Args...>)
        and factory templates called through the `template` disambiguator
      - sink class templates over a mutex policy (base_sink<Mutex>) with explicit
        instantiations in src/
      - formatter<T> specializations and user flag formatters in the example and tests
# Holdout (wave lf5, owner ruling L2, O806): a C++ subject no C++ rule was written or tuned against,
# pinned with its criterion in the commit of the rule (a scip-clang namespace symbol draws no file edge,
# the `<file>` include symbols kept; internal/langbench/scip_clang.go clangNamespace), before any index of
# it, and read ONCE with the rule unchanged into docs/bench/readings/lang/holdout/cpp.json; cpp.json stays
# the contract's reading over `repos`. Criterion: file_edge_recall >= .50 and file_edge_precision >= .95
# (§1.2's L3 excellent bars; the rule changes the file-edge truth alone); a miss is LB-Q-cpp-rest's residual,
# never tuned after the reading. Not fmt, json, spdlog, libuv or curl, nor any subject of a committed
# reading or corpus shard (yaml-cpp appears only as a conan recipe path, recipes/yaml-cpp/all/conanfile.py,
# in conan.json). `task calibrate-clone` reads `repos` only, so this list is cloned by hand. `sha` is the
# tag's commit (a lightweight tag); the licence is LICENSE read at the tag (MIT, Jesse Beder 2008-2015).
# Measured with
#   -only 'include/**,src/**,test/*.cpp,test/*.h,test/integration/**,test/node/**,util/**'
# (test/googletest-1.13.0 is vendored googletest) over the cmake compilation database:
#   cmake -S <subject> -B <subject>/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DYAML_CPP_BUILD_TESTS=ON
#         -DYAML_CPP_BUILD_TOOLS=ON -DYAML_CPP_FORMAT_SOURCE=OFF
# with scip-clang 0.4.0, the preprocessor oracle, clang-calls, clang-ast-defs and universal-ctags 6.2.1, as cpp.json.
holdout:
  - name: jbeder/yaml-cpp
    url: https://github.com/jbeder/yaml-cpp
    ref: yaml-cpp-0.9.0
    sha: 56e3bb550c91fd7005566f19c079cb7a503223cf
    licence: MIT
    idioms:
      - 'one namespace (YAML) reopened in every source and header file, with nested detail, Utils, Exp,
        conversion and anonymous namespaces: the shape K25 ruling 3 read as every file defining it'
      - 'a node API of class templates (Node, convert<T> specializations, node_iterator_base<V>) split
        between include/yaml-cpp/node/*.h declarations and include/yaml-cpp/node/detail/*.h implementations'
      - 'a hand-written scanner, parser and emitter as ordinary translation units in src/ with private
        headers beside them (scanner.h, emitterstate.h, regex_yaml.h, exp.h)'
      - 'operator overloads (operator<< on Emitter and its manipulators, operator[] on Node) and free
        function templates (as<T>, Clone, LoadFile)'
      - 'gtest and gmock tests (TEST, TEST_F, MOCK_METHOD) over a generated emitter test file and
        integration suites'
