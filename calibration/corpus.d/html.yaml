id: html
language: HTML
repos:
  - name: html5-boilerplate
    url: https://github.com/h5bp/html5-boilerplate
    ref: v9.0.1
    sha: 90066899f33e83c0866f8e078e97f9b82999db58
    licence: MIT
    idioms:
      - the boilerplate's own ids (skip links, page wrapper)
      - external stylesheet/script src/href to sibling files
      - a browser-upgrade / conditional-comment style block
  - name: bootstrap
    url: https://github.com/twbs/bootstrap
    ref: v5.3.8
    sha: 25aa8cc0b32f0d1a54be575347e6d84b70b1acd7
    licence: MIT
    subpath: js/tests/visual
    idioms:
      - real component demo pages (modal, carousel, dropdown, tooltip) with
        many ids and data-bs-* attributes
      - forms and named inputs
      - inline <style> blocks and sibling-relative CSS/JS href/src
    notes: >
      the docs site moved to Astro (.mdx) at this tag — no built-in
      "examples" tree of raw .html remains at the repo root, so this shard
      uses the small, real, idiomatic HTML the JS test suite ships instead
      (verified directly via a blobless clone: 13 files, ~150 KB)
  - name: startbootstrap-sb-admin-2
    url: https://github.com/StartBootstrap/startbootstrap-sb-admin-2
    ref: v4.1.4
    sha: f0309881ef82794a1bd6257cd321801bc38a0f3d
    licence: MIT
    idioms:
      - a 14-page admin template whose sidebar and footer link every page to
        every other by a relative local href (index.html, tables.html,
        login.html), the page-to-page denominator L3 grades
      - ids and fragment links within one page (collapse targets, modals)
      - "script and stylesheet hrefs to sibling vendor/ trees (out of scope
        for L3: design 1.8 counts only links between measured pages)"
    notes: >
      selected for wave lf6 (M4, O841) before any reading of it: lychee
      --offline resolves its page links to files of the subject (about 250
      relative hrefs, 14 .html files at the repository root, no subpath);
      the MIT licence read at the pin (LICENSE, Start Bootstrap LLC)
