id: scss
language: SCSS
# The queue's two subjects, pinned for the parse-error gate (§14.2) that refused the item in wave lf4
# (O800, LB-Q-scss-rest): every .scss file of each checkout, as cloned, parsed by the candidate pin
# tree-sitter-grammars/tree-sitter-scss 2ef6d42e (the v1.0.0 sources plus the LICENSE file; not locked). Neither
# subject holds an indented-syntax .sass file. `sha` is the commit each tag names (primer's tag is annotated).
repos:
  - name: twbs/bootstrap
    url: https://github.com/twbs/bootstrap
    ref: v5.3.8
    sha: 25aa8cc0b32f0d1a54be575347e6d84b70b1acd7
    licence: MIT
    idioms:
      - "the framework's partials (`scss/_*.scss`) joined by `@import` from the
        `bootstrap*.scss` entry files, and the docs site's own partials
        (`site/src/scss`)"
      - "`$variable: value !default` configuration and Sass maps of theme
        colours, breakpoints and utilities"
      - "`@mixin` and `@function` libraries (`scss/mixins`, `_functions.scss`)
        used through `@include` with and without arguments"
      - "`@each` and `@if` over maps, `#{}` interpolation in selectors and in
        custom-property names"
      - "nested rules with leading combinators (`> .btn`, `+ .btn`),
        `%placeholder` selectors and `@extend`"
  - name: primer/css
    url: https://github.com/primer/css
    ref: v22.3.2
    sha: be70cda91066df154f76e634d7ce993f205d282e
    licence: MIT
    idioms:
      - "one directory per component (`src/<component>/index.scss`) importing
        its partials with `@import`"
      - "`!default` variables (`src/support/variables`) and mixins
        (`src/support/mixins`: breakpoints, colour modes, typography)"
      - "responsive utility classes generated by `@each` over breakpoint maps
        with `#{$variant}` interpolated selectors"
      - "nested `&` rules (`&::-webkit-scrollbar`, `.SelectMenu-list--borderless &`)
        and `@include breakpoint(...)` media wrappers"
# Fresh holdout for the oracle-span and full-corpus scope repair. Pin and criteria are committed
# before any oracle run. Do not tune against it. The earlier angular/components holdout remains
# historical evidence under the old oracle and restricted scope.
holdout:
  - name: foundation/foundation-sites
    url: https://github.com/foundation/foundation-sites
    ref: v6.9.0
    sha: f5c7d29db04e459d94a998df9d8fd4a4447e767b
    licence: MIT
    idioms:
      - 'framework partials joined by @import; mixin and function libraries'
      - 'variables, nested selectors, interpolation and responsive utility generation'
      - 'keyframes and custom properties alongside shared configuration'
    notes: >
      Read every discovered SCSS file, including files the oracle cannot attest. No -only filter.
      Pre-registered success: L1-L3 excellent under the existing thresholds and oracle tiers,
      zero faults and three-run median throughput at least 1 MB per CPU second. Report a ceiling
      when unavailable truth or a real extractor gap prevents this; never trim the subject.
