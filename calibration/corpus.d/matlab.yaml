id: matlab
language: MATLAB
# `.m` is claimed only by a content sniff (a leading function/classdef or a % comment); a file the sniff
# does not settle is left unclassified, so the subjects' scripts and ObjC-shaped files never count as MATLAB.
repos:
  - name: altmany/export_fig
    url: https://github.com/altmany/export_fig
    ref: v3.58
    sha: b9c20a510840aa1cf9e309d667d4fcfbbf095bac
    licence: BSD-3-Clause
    idioms:
      - "function files: one large main function (`export_fig`, over 1,700 lines) followed by local functions (`selectUtilityPath`), a `%` help block under the signature"
      - "a multi-output signature with a lint pragma on the function line (`function [imageData, alpha] = export_fig(varargin) %#ok<*STRCL1>`)"
      - "varargin/nargin option parsing"
      - "platform branches (ispc, ismac, isunix) around system calls, in 6 of 18 files"
  - name: chebfun/chebfun
    url: https://github.com/chebfun/chebfun
    ref: v5.7.0
    sha: d762a8aa9dd9080534ffe7456126673996c43cbf
    licence: BSD-3-Clause
    idioms:
      - "classdef files under @-folders (`@chebfun/chebfun.m`) with properties blocks and methods blocks"
      - "old-style @class method files (one `function` per file in an `@chebfun` directory) beside classdef ones"
      - "+package folders (`+cheb`) and static methods called as `cheb.gallery`"
      - "test files (`test_*.m`) whose first line is a function, and long help blocks under the signature"
  - name: matlab2tikz/matlab2tikz
    url: https://github.com/matlab2tikz/matlab2tikz
    ref: v1.1.0
    sha: 816f8754804cd45d8b41b3adf3ff9709a29cf173
    licence: BSD-2-Clause
    idioms:
      - "one large main function (`matlab2tikz`) followed by dozens of local functions in `src/`, with a `%` help block under each signature"
      - "test files (`test/`) holding a function-based suite of figure fixtures, each a short function"
      - "old-style function files with `varargin`/`nargin` option parsing and `ispc`/`ismac` platform branches"
