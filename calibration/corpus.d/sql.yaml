id: sql
# 2026-09-28 (owner decision D2): measured on the families DerekStride/tree-sitter-sql
# supports (ANSI, SQLite, PostgreSQL) only. chinook-database stays listed for
# provenance but is no longer a subject: its SQLite/PostgreSQL files are 400-600 KB
# data dumps whose trees exceed the 64 MiB module cap (RT-107) and fault; sqitch is
# measured on its SQLite and plain fixture files (lang-oracle -only), not its
# psql-templated pg.sql (:"registry" variables are not SQL).
language: SQL
repos:
  - name: chinook-database
    url: https://github.com/lerocha/chinook-database
    ref: v1.4.5
    sha: 4a944a942426e1f3263fe539155fb7ef92b04b4a
    # GitHub's own detector reads this repo as other/unassertable (it ships
    # LICENSE.md, not LICENSE), but the file's text is plain MIT.
    licence: MIT
    idioms:
      - 'one flat schema file per RDBMS dialect (ChinookDb_Sqlite.sql,
        ChinookDb_PostgreSql.sql, ChinookDb_MySql.sql): the same 11-table
        catalog reissued across several CREATE TABLE dialects'
      - 'double-quoted, schema-bare table and column identifiers throughout
        the ANSI/PostgreSQL variant (quoted Artist, quoted AlbumId, ...)'
      - 'every table an explicit CONSTRAINT-named PRIMARY KEY and one or more
        CONSTRAINT-named FOREIGN KEY ... REFERENCES clauses (the fact table
        InvoiceLine alone carries three)'
      - 'CREATE INDEX statements grouped in a block after every table is
        defined, not interleaved with their owning CREATE TABLE'
  - name: sqitch
    url: https://github.com/sqitchers/sqitch
    ref: v1.6.1
    sha: ce0550c45ade3527d0c7f981c934e1ea4bdd6c19
    licence: MIT
    idioms:
      - 'a database change-management tool''s own test fixtures: t/sql/ and
        t/pg/ hold small, hand-written deploy/revert/verify .sql scripts
        (Sqitch''s own DDL for tracking changes, plus fixtures per engine)'
      - 'CREATE TABLE ... plpgsql function bodies (CREATE OR REPLACE
        FUNCTION ... AS dollar-quoted body LANGUAGE plpgsql) in the
        PostgreSQL registry schema'
      - 'CREATE VIEW definitions joining the registry''s own tracking tables'
      - 'mixed single- and double-quoted identifiers across the sqlite, pg,
        mysql, oracle and vertica engine variants under t/'
  - name: devrimgunduz/pagila
    url: https://github.com/devrimgunduz/pagila
    ref: pagila-v4.1.1
    sha: 9baf49c4149e43229f6021e6218d6b2ac8ef4f34
    # LICENSE.txt is the MIT text. Measured with lang-oracle -only
    # 'pagila-schema.sql,pagila-schema-jsonb.sql,pagila-temporal-setup.sql':
    # the data files (13 and 19 MB) are past ingest's 2 MiB gate anyway.
    licence: MIT
    idioms:
      - 'pg_dump-style PostgreSQL DDL: CREATE TABLE, then primary and foreign
        keys added by ALTER TABLE ONLY ... ADD CONSTRAINT'
      - 'plpgsql and SQL functions, triggers and views over the same schema'
      - 'declarative partitioning: a partitioned payment table and ALTER TABLE
        ... ATTACH PARTITION per month'
      - 'CREATE TYPE ... AS ENUM, domains and sequences'
