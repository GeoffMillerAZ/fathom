id: solidity-holdout
language: Solidity
# The holdout for LB-Q-solidity (K19), pinned with the solc oracle before any tuning or reading under it (a worker commit at
# 2026-10-19 22:28; the tags.scm tuning followed at 22:30 and the one holdout reading at 22:32, the dialect unchanged after it;
# the branch was squashed into one commit, so main shows the pin and the reading together, and the readings' fathom_commit
# values, 1cd3b320c and af95b57ed, name those pre-squash worker commits), and read ONCE with the dialect
# unchanged into docs/bench/readings/lang/holdout/solidity.json; solidity.json stays the
# contract's reading over solidity.yaml's repos. Criterion (pre-registered): the holdout reading's level_met is L2 (any grade; L1 and
# L2 met against the same tier-A oracle), and LB-Q-solidity flips [x] only when it does and solidity.json reads L2 too; a miss
# writes a note beginning `L2 ceiling: ` in solidity.json and LB-Q-solidity stays open, nothing tuned after the holdout reading.
# Vectorized/solady is not OpenZeppelin, forge-std or solmate (the tuning subjects), and appears in no docs/bench/readings/** or
# calibration/** file (grep at 801476adf). It is heavy in inline assembly, packed bytes and free functions, which the tuning
# subjects hold less of. Licence read at the pin: LICENSE.txt, the MIT licence.
repos:
  - name: Vectorized/solady
    url: https://github.com/Vectorized/solady
    ref: v0.1.26
    sha: acd959aa4bd04720d640bf4e6a5c71037510cc4b
    licence: MIT
    subpath: src
    idioms:
      - 'gas-golfed libraries (LibString, LibBit, FixedPointMathLib, SafeTransferLib) written mostly in inline assembly'
      - 'tokens (ERC20, ERC721, ERC1155, ERC6909) with virtual hooks and custom-error reverts'
      - 'minimal proxies and CREATE2 factories (LibClone, CREATE3) and a utils/ tree of free functions and file-level constants'
      - 'a single-file contract style where a library is imported by relative path and called as Lib.fn(...)'
