  - name: vitepress
    url: https://github.com/vuejs/vitepress
    ref: v1.6.4
    sha: 1fc537b78cda287fa23c1129a815ad9455fd8106
    licence: MIT
    idioms:
      - "the default theme's 91 VP* components, each importing the components it
        renders by './VPName.vue': the .vue-to-.vue graph L3 reads"
      - "composables and support modules imported from ../composables/*.ts and
        ../support/*.ts (targets outside the measured .vue files)"
      - "<script setup lang=\"ts\"> with defineProps, computed and watch at the
        top level"
    notes: >
      substitutes the queue's vuejs/docs (design §13.3: a subject whose licence is
      no OSI licence is replaced, saying why): vuejs/docs' LICENSE puts its
      contents under CC BY 4.0. VitePress is the Vue team's own Vue 3 application
      (MIT). 97 .vue files, 7 MB: no subpath.
