# docs/design/language-breadth.md §1.8 ("W4 for Vue and Svelte") before any
# reading of either subject. Neither subject is in any reading or shard before
# this commit. Each licence was read at its pin.
repos:
  - name: element-plus
    url: https://github.com/element-plus/element-plus
    ref: 2.14.7
    sha: 77d5c32c4ebcfffde67e51f6325c6d350ca668a0
