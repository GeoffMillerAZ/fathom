id: solidity
language: Solidity
# Three tuning subjects, each read by solc (tier A) one file at a time with its own import closure. The queue named
# Uniswap v4-core: its src/ is licensed per file (BUSL-1.1 on most core contracts, which is not OSI-approved, MIT on
# the rest), so it fails §13.3's licence rule and is replaced by foundry-rs/forge-std (the queue's second subject) and
# transmissions11/solmate (gas-optimised tokens and utilities, the other widely copied 0.8 base layer).
# `subpath` keeps each clone to the Solidity the project ships (OpenZeppelin's contracts/ without its Hardhat tests).
repos:
  - name: OpenZeppelin/openzeppelin-contracts
    url: https://github.com/OpenZeppelin/openzeppelin-contracts
    ref: v5.6.1
    sha: 5fd1781b1454fd1ef8e722282f86f9293cacf256
    licence: MIT
    subpath: contracts
    idioms:
      - 'abstract contracts, interfaces and libraries across an import graph of relative paths (access, token, utils, proxy, governance)'
      - 'custom errors (error ERC20InsufficientBalance(...)) raised by revert, and events raised by emit'
      - 'modifiers (onlyOwner, whenNotPaused, initializer) applied to functions, virtual and override chains with super calls'
      - 'libraries attached with using X for Y (Math, SafeERC20, Address, Strings, EnumerableSet) and called as members'
      - 'user-defined value types and file-level free functions and constants (Panic, Time, SlotDerivation)'
  - name: foundry-rs/forge-std
    url: https://github.com/foundry-rs/forge-std
    ref: v1.17.0
    sha: f3dae6e6ee381f25eb6a246f7da9b85c91a68219
    licence: MIT OR Apache-2.0
    subpath: src
    idioms:
      - 'a very large interface (Vm, hundreds of cheatcode functions) with no function bodies'
      - 'abstract test and script base contracts that inherit one another (Test, StdAssertions, StdCheats, StdUtils)'
      - 'libraries of internal helpers with assembly blocks (StdStorage, StdStyle, StdMath, StdError)'
      - 'structs, enums and events declared beside the functions that use them'
  - name: transmissions11/solmate
    url: https://github.com/transmissions11/solmate
    ref: v6
    sha: a9e3ea26a2dc73bfa87f0cb189687d029028e0c5
    licence: AGPL-3.0
    subpath: src
    idioms:
      - 'tokens (ERC20, ERC721, ERC4626) whose constructors, events and virtual hooks are inherited by examples'
      - 'libraries of inline-assembly math and transfer helpers (SafeTransferLib, FixedPointMathLib)'
      - 'a free-standing Owned and Auth access layer with modifiers and authority contracts'
      - 'tests under src/test that import ds-test and forge-std (excluded when their dependency is not present)'
