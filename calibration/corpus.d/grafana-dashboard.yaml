id: grafana-dashboard
language: Grafana dashboards and provisioning
# Subjects for LB-Q-grafana-dashboard (wave c3, item obs). Dashboards built by
# mixins (kube-prometheus, Thanos' legacy-row dashboards) and hand-edited ones
# with a provisioning tree (the OpenTelemetry demo). kube-prometheus' dashboards
# and provisioning are embedded in ConfigMaps and a Secret, read as a derived
# tree (calibration/oracles/grafana -derive-embedded) with its PrometheusRule
# specs derived (calibration/oracles/prometheus -derive-prometheusrules). All
# are read only, never vendored.
repos:
  - name: prometheus-operator/kube-prometheus
    url: https://github.com/prometheus-operator/kube-prometheus.git
    ref: v0.19.0
    sha: 799f3d73b5adf5758c3119c9201d9f417accb6d0
    licence: Apache-2.0
    sparse: ["manifests/**"]
    idioms:
      - "grafana-dashboardDefinitions.yaml: 33 dashboards in a ConfigMapList, $datasource variables, recording rules read by panels, /d/<uid> data links"
      - "grafana-dashboardSources.yaml, grafana-dashboardDatasources.yaml: provisioning in a ConfigMap and a Secret, a provider path a Kubernetes volume mounts"
  - name: thanos-io/thanos
    url: https://github.com/thanos-io/thanos.git
    ref: v0.42.4
    sha: 45c4f39487e1653e606307d3952a6259fb96acae
    licence: Apache-2.0
    sparse: ["examples/**"]
    idioms:
      - "examples/dashboards/*.json: schemaVersion 14 legacy rows, string datasources, an interval variable in ranges"
  - name: open-telemetry/opentelemetry-demo
    url: https://github.com/open-telemetry/opentelemetry-demo.git
    ref: 3.1.0
    sha: dedc0178918e260823323b8d95005a8cb924b007
    licence: Apache-2.0
    sparse: ["src/grafana/**", "src/prometheus/**", "*.yaml"]
    idioms:
      - "src/grafana/provisioning: dashboards, datasources with uids panels name, alerting rules, contact points and policies"
      - "compose.observability.yaml: the bind mount that maps the provider's container path to the dashboards"
