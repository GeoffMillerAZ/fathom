id: rust
language: Rust
# Measurement conventions (docs/bench/readings/lang/rust.json): each subject is measured as
# cloned; the dependencies rust-analyzer needs to resolve types are fetched into a scratch
# CARGO_HOME (never the clone), and target/ is a scratch CARGO_TARGET_DIR outside it. `sha` is
# the peeled commit of the release tag (both are annotated tags).
repos:
  - name: BurntSushi/ripgrep
    url: https://github.com/BurntSushi/ripgrep
    ref: 14.1.1
    sha: 4649aa9700619f94cf9c66876e9549d83420e16c
    licence: MIT OR Unlicense
    idioms:
      - 'a Cargo workspace of small library crates (grep-*, ignore, globset) beside the rg binary'
      - 'traits with generic implementors and trait impls for reference and boxed receivers'
      - 'enums with data and error enums implementing Display and From'
      - 'nested inline modules, #[cfg(test)] mod tests blocks and macro_rules! helpers'
      - 'builder-pattern structs with chained &mut self setters and iterators over closures'
  - name: clap-rs/clap
    url: https://github.com/clap-rs/clap
    ref: v4.6.1
    sha: ac5fda6a799e4c640d671edd1111d4a5e723dc1a
    licence: MIT OR Apache-2.0
    idioms:
      - 'a proc-macro crate (clap_derive) built on syn, quote and proc_macro2'
      - 'builder types with many #[must_use] consuming setters and trait default methods'
      - 'feature-gated modules and items (#[cfg(feature = "...")])'
      - 'generic traits with associated types and impl blocks over several type parameters'
      - 'declarative macros invoked with call-shaped arguments (arg!, value_parser!)'
# Holdout (wave lf4, D3, K25 ruling 3, O751): a crate no Rust rule was written or tuned against,
# read ONCE with the rule unchanged into docs/bench/readings/lang/holdout/rust.json; rust.json stays
# the contract's reading over `repos`. `task calibrate-clone` reads `repos` only, so this list is
# cloned by hand (the same fields). Not ripgrep or clap, nor any crate in a committed Rust or Cargo
# reading (rust.json, parity/rust.json, cargo.json: cargo, tokio). `sha` is the tag's commit
# (a lightweight tag).
holdout:
  - name: crossbeam-rs/crossbeam
    url: https://github.com/crossbeam-rs/crossbeam
    ref: crossbeam-0.8.5
    sha: 2920c984290229ab4e0ca0452ef09e48a82063f3
    licence: MIT OR Apache-2.0
    idioms:
      - 'a Cargo workspace of six libraries (crossbeam and crossbeam-channel, -deque, -epoch, -queue,
        -utils; crossbeam-skiplist is in the tree but not a member) and a benchmarks package of 12 bin
        targets, each library with tests/ and channel, epoch and utils with benches/ or examples/, so
        rust-analyzer defines `crate/` and same-named root items once per target'
      - 'lock-free data structures over raw atomics and unsafe pointer code (epoch-based reclamation)'
      - 'a declarative select! macro and macro_rules! helpers invoked across modules'
      - 'cfg-gated modules (#[cfg(crossbeam_loom)], #[cfg(feature = "std")]) and re-export facades (pub use)'
      - 'generic types with trait bounds, Drop impls and PhantomData markers'
  # Holdout 2 (wave lf5, owner ruling L1 on O795): a NEW crate, read ONCE into
  # docs/bench/readings/lang/holdout/rust-regex.json with O751's steps 2 (a reference inside a defining
  # document is to its own copy) and 4 (a module is the copy in the nearest directory above the reference)
  # restored for that reading only, by an uncommitted local switch (the 8588dc5b revert undone in
  # internal/langbench/scip_rust.go, built into a scratch indexbench; nothing committed until the verdict).
  # Criterion, committed alone before any index of it, naming ONLY the metrics O751's narrowing feeds:
  # file_edge_recall >= .50 and file_edge_precision >= .95 (§1.2's L3 excellent bars). Pass: steps 2 and 4
  # are restored for good and rust.json is re-read on ripgrep and clap. Fail: the revert stands and
  # LB-Q-rust-rest records the reading; nothing is tuned after it. Not ripgrep, clap, crossbeam, cargo or
  # tokio, nor any crate of a committed reading or corpus shard. Per-target duplicates: regex-automata's lib
  # (src/dfa, src/hybrid, src/meta, src/nfa) and its test target (tests/dfa, tests/hybrid, tests/meta,
  # tests/nfa, one `[[test]]` root tests/lib.rs) define the same module symbols (`dfa/`, `hybrid/`, ...), every
  # package's lib.rs and test or bench root share `crate/` (regex's tests/lib.rs, regex-lite's tests/lib.rs,
  # regex-syntax's benches/bench.rs), and regex-cli is a bin. Measured with
  #   -only 'src/**,tests/**,regex-automata/**,regex-capi/**,regex-cli/**,regex-lite/**,regex-syntax/**,regex-test/**'
  # (fuzz/ declares its own [workspace], so it is no member and rust-analyzer indexes none of it; chosen
  # before any index), rust-analyzer scip with {"cargo":{"features":"all"}}, as rust.json. `sha` is the peeled
  # commit of the annotated tag; the licence is LICENSE-MIT and LICENSE-APACHE read at the tag and every
  # member's Cargo.toml `license = "MIT OR Apache-2.0"`.
  - name: rust-lang/regex
    url: https://github.com/rust-lang/regex
    ref: 1.13.1
    sha: 2b527599eb9eea0dcc288c704584f242f26a5c61
    licence: MIT OR Apache-2.0
    idioms:
      - 'the regex package and a workspace of six members (regex-automata, regex-syntax, regex-lite,
        regex-cli, regex-capi, regex-test); the test target of regex-automata mirrors its library module
        tree, so rust-analyzer defines `dfa/`, `hybrid/`, `meta/` and `nfa/` once in src/ and once in tests/'
      - 'very large generated tables (regex-syntax/src/unicode_tables/*.rs: static slices of ranges) and
        serialized DFA fixtures loaded by include_bytes!'
      - 'feature-gated modules on nearly every item (#[cfg(feature = "dfa-build")], "syntax", "perf-*")'
      - 'trait objects and generic automata (Automaton, a dense and a sparse DFA over AsRef<[u32]>), builders
        with Config structs, and unsafe byte-level search loops'
      - 'a C API crate (regex-capi: #[no_mangle] extern "C" functions over raw pointers) and a CLI with
        nested subcommand modules (regex-cli/cmd/*)'
