id: typescript
language: TypeScript
# The L4 holdout for LB-Q-typescript (wave lf4, owner ruling D2, K19): two subjects the TS/JS
# rules were never tuned on, chosen before any index ran. Criteria: an OSI licence read at the
# tag; a release tag and its commit from git ls-remote; 200 to 2,000 .ts files measured, so
# scip-typescript 0.4.0 indexes each with its dependencies npm-installed in scratch; no .tsx
# document in the measured set (O749's scope question stays out of the reading); absent, by repo
# and npm name, from every committed reading and corpus shard (nest, zod, typeorm, axios,
# express, webpack, lodash, bulletproof-react, react-router and the routes subjects excluded);
# idioms unlike nest's decorated classes and zod's schema builders. Measured as cloned; the
# index is taken in a second checkout with `npm ci --ignore-scripts` (calibration/oracles/
# scip-typescript/README.md).
repos:
  - name: gcanti/fp-ts
    url: https://github.com/gcanti/fp-ts
    ref: 2.16.9
    sha: 669cd3ed7cb5726024331a7a1cf35125669feb30
    licence: MIT
    idioms:
      - 'type-class instances as exported object literals (`export const Functor: Functor1<URI> = { URI, map: _map }`)'
      - 'higher-kinded types through `declare module` interface augmentation (URItoKind) in 39 modules'
      - 'overloaded and curried exported const arrow functions composed with pipe and flow'
      - 'interfaces and type aliases for data types (Option, Either, Task) with tagged-union members'
      - 'dtslint type tests ($ExpectType comments) and mocha tests beside src/'
  - name: ReactiveX/rxjs
    url: https://github.com/ReactiveX/rxjs
    ref: 7.8.1
    sha: 72bc92191ab959e27a969dc4476e14d95416573f
    licence: Apache-2.0
    # measured on src/, spec/ and spec-dtslint/ (586 .ts files); docs_app/ (an Angular app with
    # its own package.json and lockfile) and integration/ are out of scope
    idioms:
      - 'classes with subclass chains (Observable, Subject, BehaviorSubject, Subscriber, Scheduler actions)'
      - 'pipeable operators: overloaded generic functions returning OperatorFunction<T, R> closures'
      - 'barrel modules re-exporting the internal tree (src/index.ts, src/operators/index.ts)'
      - 'marble-diagram specs (TestScheduler, hot/cold, expectObservable) in mocha describe/it callbacks'
      - 'type-only tests (spec-dtslint) and deprecated overload signatures'
  # The TSX holdout (wave lf5, item tsjs; owner ruling L5, K19): .tsx joins TypeScript's measured scope in this
  # commit (O749), so TypeScript's L4 is read once on a TSX-heavy subject, pinned before any index ran. Criteria: a
  # React component library or app; an OSI licence read at the tag; a release tag and its commit from git
  # ls-remote; 200 to 2,000 .ts/.tsx/.mts/.cts files measured, most of them .tsx; its own tsconfig.json; absent, by
  # repo and npm name, from every committed reading and corpus shard (fp-ts, rxjs, nest, zod, typeorm and
  # react.yaml's opentelemetry-demo, bulletproof-react, next.js and react-router excluded; radix-ui/primitives
  # passed over because react.yaml's idioms name its alias shape). Measured with `-only src/**,test/**,tests/**`
  # (233 files, 216 .tsx); www/ is a Docusaurus site with its own package.json and yarn.lock. The index is taken in a
  # second checkout with `yarn install --frozen-lockfile --ignore-scripts` (yarn 1.22.19, its packageManager).
  - name: react-bootstrap/react-bootstrap
    url: https://github.com/react-bootstrap/react-bootstrap
    ref: v2.10.10
    sha: 8b1cb721001cb1a47b068002d1bed12d12b8d88b
    licence: MIT
    idioms:
      - 'components as `React.forwardRef<HTMLElement, Props>` bound to typed consts (`const Button: BsPrefixRefForwardingComponent<"button", ButtonProps> = React.forwardRef(...)`), Object.assign sub-components (`Card.Body`)'
      - '*Props interfaces extending BsPrefixProps and HTML attribute types, with propTypes objects beside them'
      - 'hooks (useBootstrapPrefix, useEventCallback, useMergedRefs) and context providers (ThemeProvider, NavbarContext)'
      - 'vitest + @testing-library specs in test/*Spec.tsx rendering JSX inside describe/it callbacks'
  # The TSX holdout under owner ruling M2 (wave lf6, item tsjs, K19): a JSX element is a call (design §1.8, LB-F481),
  # pinned in the rule's own commit before any index of it ran; react-bootstrap's reading is spent (moved to
  # docs/bench/readings/lang/holdout/typescript-react-bootstrap.json). Criteria, as ruling L5's: a React component
  # library; an OSI licence read at the tag; a release tag and its commit from git ls-remote; 200 to 2,000
  # .ts/.tsx/.mts/.cts files measured, most of them .tsx; its own tsconfig.json; its dependencies installable in
  # scratch within 20 minutes; absent, by repo and npm name, from every committed reading (tuned/, holdout/, parity/,
  # baseline/ included) and corpus shard (react-bootstrap, fp-ts, rxjs, nest, zod, typeorm and react.yaml's
  # opentelemetry-demo, bulletproof-react, next.js and react-router excluded). Vetted in the brief's order, the first
  # passes: tailwindlabs/headlessui @headlessui/react@v2.2.10 (MIT in LICENSE and packages/@headlessui-react/LICENSE
  # at the tag; package-lock.json, `npm ci --ignore-scripts` 998 packages in 19 s); radix-ui/primitives,
  # palantir/blueprint and mantinedev/mantine were not needed. Measured with the package directory as the subject
  # root (`-subject <clone>/packages/@headlessui-react`: 201 files, 115 .tsx; the Vue package and the playgrounds are
  # other workspaces), under its own tsconfig.json (strict, jsx react, moduleResolution node). The index is taken in a
  # second checkout, the workspace's dependencies installed at its root, with run.sh at
  # packages/@headlessui-react over 'src/**/*.ts' 'src/**/*.tsx' 'types/**/*.ts'.
  - name: tailwindlabs/headlessui
    url: https://github.com/tailwindlabs/headlessui
    ref: '@headlessui/react@v2.2.10'
    sha: d13526d02a2de92c4ad7b62c15cd980636543fe2
    licence: MIT
    idioms:
      - 'render functions wrapped by a helper and bound to `let` (`export let MenuButton = forwardRefWithAs(ButtonFn) as _internal_ComponentMenuButton`), joined into compound components with Object.assign (`<Menu.Button>`)'
      - 'one polymorphic render path (`useRender()`, the `as` prop, render-prop children) shared by every component'
      - 'hooks (useSyncRefs, useEvent, useResolveButtonType, useFloatingPanel) and state machines with reducers and selectors (menu-machine.ts, stack-machine.ts)'
      - 'jest + @testing-library specs in *.test.tsx rendering JSX inside describe/it callbacks, with test-utils interaction helpers'
  # The TSX holdout under owner ruling S3 (wave lf7, item tsx, K19): TypeScript's module-level let and var are
  # definitions (LB-F486) and a member of an anonymous type literal leaves def_mapping's denominator (LB-F511,
  # design §1.8), pinned in the rule's own commit before any index of it ran; headlessui's reading is spent (moved to
  # docs/bench/readings/lang/holdout/typescript-headlessui.json). Criteria, as ruling M2's: a React component library;
  # an OSI licence read at the tag; a release tag and its commit from git ls-remote; a package directory of roughly
  # 200 to 2,000 .ts/.tsx/.mts/.cts files measured, most of them .tsx, let-style or not; indexed under its own
  # tsconfig; its dependencies installable in scratch from its own lockfile with scripts off; absent, by repo and npm
  # name, from every committed reading (tuned/, holdout/, parity/, baseline/ included) and corpus shard (headlessui,
  # react-bootstrap, fp-ts, rxjs, nest, zod, typeorm and react.yaml's opentelemetry-demo, bulletproof-react, next.js
  # and react-router excluded). Vetted in the brief's order:
  # - radix-ui/primitives 1.6.7 (9aebdd45, MIT; its one tag) refused on the criteria, not on K19: no package directory
  #   reaches 200 files (packages/react holds 59 packages, 197 files, 98 .tsx: not mostly .tsx) and no tsconfig.json
  #   covers more than one package. K19 would not have refused it: react.yaml names Radix aliases (`const Dialog =
  #   DialogPrimitive.Root`) as bulletproof-react's idiom, the consumer's code the dialect's alias rule was tuned on;
  #   radix's own source, which writes the primitives (`const Root = Dialog`), is in no reading or corpus entry.
  # - palantir/blueprint @blueprintjs/core@6.21.0 passes and is pinned: Apache-2.0 in LICENSE and
  #   packages/core/LICENSE at the tag; pnpm-lock.yaml (lockfileVersion 9.0, packageManager pnpm@11.3.0),
  #   `pnpm install --frozen-lockfile --ignore-scripts` in 36 s; mantinedev/mantine was not needed. Measured with the
  #   package's source directory as the subject root (`-subject <clone>/packages/core/src`: 299 files, 218 .tsx; its
  #   tests (*.test.tsx) and stories (*.stories.tsx) beside the sources; packages/core holds nothing else but two
  #   vitest configs), under its own compiler options: src/tsconfig.json there is a solution file (`"files": []` and
  #   references, no compiler options), so the oracle checkout gets a copy of src/tsconfig.test.json (the program
  #   config for the sources and tests: extends tsconfig.build.json and config/tsconfig.web.json, jsx react-jsx,
  #   moduleResolution node, strict) as src/tsconfig.json for the run, as eslint's tsconfig.base.json was (README).
  #   The index is taken in a second checkout with the workspace's dependencies installed at its root, with run.sh at
  #   packages/core/src over '**/*.ts' '**/*.tsx'. Pre-registered criterion: the holdout's level_met is L4.
  - name: palantir/blueprint
    url: https://github.com/palantir/blueprint
    ref: '@blueprintjs/core@6.21.0'
    sha: c5a3873b2e6de678aeee02d548732d92601884f5
    licence: Apache-2.0
    idioms:
      - 'function components as `forwardRef<HTMLButtonElement, ButtonProps>` bound to typed consts (`export const Button: React.FC<ButtonProps> = forwardRef<...>((props, ref) => ...)`), a `displayName` assigned after'
      - 'class components extending AbstractPureComponent<Props, State> (Popover, Overlay2, Tabs, Tooltip) with lifecycle methods and static defaultProps'
      - '*Props interfaces extending Props and HTML attribute types (`TabProps extends Props, Omit<HTMLDivProps, "id" | "title" | "onClick">`); class-name constants in common/classes.ts'
      - 'hooks (useHotkeys, useOverlayStack, usePrevious, useTimeout) and React contexts (PortalContext, OverlaysContext, HotkeysContext)'
      - 'vitest + @testing-library specs in *.test.tsx and Storybook stories in *.stories.tsx beside the components'
