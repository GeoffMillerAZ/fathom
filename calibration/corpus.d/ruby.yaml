id: ruby
language: Ruby
# `sha` is the peeled commit of the release tag (both tags are annotated; their tag objects,
# 518c22e9 and 29e9da20, are what calibration/corpus.yaml records).
repos:
  - name: sinatra/sinatra
    url: https://github.com/sinatra/sinatra
    ref: v4.2.1
    sha: 599a007a779dc9940e49f34e9077220f4c209f4b
    licence: MIT
    idioms:
      - 'DSL methods (get/post/before/after) defined on the class body through singleton methods'
      - 'modules and mixins (include, extend, prepend) and nested Sinatra::Base subclasses'
      - 'singleton classes (class << self) holding the framework''s settings and helpers'
      - 'constants (VERSION, CONTENT_TYPES) and attr_reader/attr_accessor declarations'
      - 'require and require_relative of sibling files, and method_missing/define_method metaprogramming'
  - name: jekyll/jekyll
    url: https://github.com/jekyll/jekyll
    ref: v4.4.1
    sha: 1f319fb273b6cdf876bc6edd38d7477935cdda8c
    licence: MIT
    idioms:
      - 'deep module and class nesting under Jekyll:: with reopened classes'
      - 'attr_accessor/attr_reader/attr_writer, private and protected sections'
      - 'class methods via def self.x and class << self'
      - 'constants and frozen string literals, Comparable and Enumerable mixins'
      - 'plugin registration DSL (Liquid tags, hooks) and require_all of lib/jekyll/*.rb'
  # Sorbet-typed subjects for scip-ruby (tier A, each indexed with its own sorbet/config) and the runtime require
  # trace (calibration/oracles/ruby-require-trace), measured in wave lx for LB-Q-ruby-rest. They are not graded: under
  # the re-pin rule (docs/plans/language-breadth.md F.31) they would lose L3, so the reading keeps sinatra and jekyll.
  - name: Shopify/ruby-lsp
    url: https://github.com/Shopify/ruby-lsp
    ref: v0.26.11
    sha: 6745c162fce98b1738f8f602fbca38806c6863aa
    licence: MIT
    idioms:
      - 'Sorbet sigils (typed: strict and true) with RBS comment signatures and casts (`#: as !nil`)'
      - 'one entry file (ruby_lsp/internal.rb) requiring the whole library'
      - 'Prism visitors and listeners dispatching on node types'
      - 'tests embedding Ruby source in heredocs, run against the server'
  - name: Shopify/spoom
    url: https://github.com/Shopify/spoom
    ref: v1.8.10
    sha: a621b82c6f056e4d5acc85909da28f3fc337de9e
    licence: MIT
    idioms:
      - 'every file Sorbet-typed (strict, true, one strong), with RBS comment signatures (`#: (String) -> void`)'
      - 'subsystem entry files requiring their parts with require_relative'
      - 'Thor CLI classes with desc and option class-body calls'
      - 'deadcode plugins (class X < Base) configured through class-body DSL calls (ignore_methods_named)'
