id: prisma-holdout
language: "Prisma schema"
# The holdout for the prisma dialect's L3 rule (LB-Q-prisma, wave lang6), pinned in the commit of the dialect
# and its oracle, before any reading of this subject. It is NOT read yet: the dialect stops at L2 (no import
# strategy, O1419, LB-Q-prisma-rest), so there is no L3 rule to hold out against, and a reading now would spend
# it. It is read ONCE into docs/bench/readings/lang/holdout/prisma.json when the global-name rule (LB-F580)
# lands and the rule is fixed; never tuned against (a later rule change needs a new holdout). Not
# calcom/cal.com or hiroppy/web-app-template (the tuning subjects). prisma/prisma-examples is Prisma's own
# example collection: dozens of independent schema.prisma files in sibling directories, so a model name repeats
# across schemas (User, Post) and nothing links the files. Licence read at the pin.
repos:
  - name: prisma/prisma-examples
    url: https://github.com/prisma/prisma-examples
    ref: latest
    sha: 51b3202cae5418b54314a2bb53f70b27c6558573
    licence: Apache-2.0
    sparse: ["**/*.prisma"]
    idioms:
      - 'many independent schema.prisma files, each with its own datasource and generator'
      - 'the same model names (User, Post) defined by several schemas in sibling directories'
      - 'implicit and explicit many-to-many relations, enums, optional and list fields'
