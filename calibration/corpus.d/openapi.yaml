id: openapi
language: "OpenAPI / Swagger documents"
# Four read-only subjects, none vendored, each through section 13.3's licence gate (OSI
# permissive: Apache-2.0, MIT). OAI/OpenAPI-Specification 3.0.4's examples directory is
# the specification's own hand-written set: Swagger 2.0 and OpenAPI 3.0 documents, YAML
# and JSON, with a petstore split into fragment files. Redocly/openapi-starter is a
# multi-file OpenAPI 3.1 description whose operations live in `paths/*.yaml` fragments
# that carry no `openapi:` key (so only its root is a document). kubernetes' v3
# descriptions are one large machine-written API (63 OpenAPI 3.0 JSON documents, 2,472
# entities under the ingest's 2 MiB read cap; api__v1_openapi.json, 2.1 MB, is over it).
# Azure/azure-rest-api-specs' common-types and two services are Swagger 2.0 JSON
# documents that name each other by relative file `$ref`s, the only subject whose
# cross-file references land on documents (25 pairs). stripe/openapi (MIT) was tried and
# dropped: its spec3.yaml and spec3.json (5 and 6 MB) are over the 2 MiB read cap, so
# ingest reads neither.
repos:
  - name: OAI/OpenAPI-Specification
    url: https://github.com/OAI/OpenAPI-Specification.git
    ref: 3.0.4
    sha: b8953109f2eb4d9eebcc7f702f70456b2e074567
    licence: Apache-2.0
    sparse: ["examples/**"]
    idioms:
      - "Swagger 2.0 and OpenAPI 3.0 petstores, each as YAML and as JSON (examples/v2.0,
        examples/v3.0), with $ref to #/definitions, #/parameters, #/components/schemas"
      - "a split description (petstore-separate): swagger.yaml with $ref to spec/Pet.yaml,
        spec/parameters.yaml and common/Error.yaml, fragments that carry no swagger: key"
      - "a Swagger 2.0 document written with an indented root (every key two spaces in),
        which the classifier's column-0 openapi:/swagger: signal does not claim"
      - "securityDefinitions, x- extension keys under a path item, and callbacks and links
        (3.0) that nest operations beneath an operation"
  - name: Redocly/openapi-starter
    url: https://github.com/Redocly/openapi-starter.git
    ref: main
    sha: 9cf62a576cac37ac90c875337fdebb3f09a072c6
    licence: MIT
    idioms:
      - "OpenAPI 3.1 split by `$ref: paths/menu.yaml` and `$ref: components/schemas/Order.yaml`,
        every fragment a file with no openapi: key"
      - "webhooks: a path-item map keyed by name, each a $ref to a fragment"
      - "redocly.yaml, a tool configuration with a top-level `openapi:` mapping that is not a
        document (the classifier claims it; the dialect reads nothing from it)"
  - name: Azure/azure-rest-api-specs
    url: https://github.com/Azure/azure-rest-api-specs.git
    ref: main
    sha: 06f410c3524282f63f72f7f332df5423b3d52f31
    licence: MIT
    sparse:
      - "specification/common-types/**"
      - "specification/appconfiguration/resource-manager/Microsoft.AppConfiguration/AppConfiguration/stable/2024-06-01/**"
      - "specification/appconfiguration/resource-manager/Microsoft.AppConfiguration/AppConfiguration/stable/2023-03-01/**"
      - "specification/appconfiguration/data-plane/AppConfiguration/stable/2024-09-01/**"
      - "specification/keyvault/resource-manager/Microsoft.KeyVault/KeyVault/stable/2024-11-01/**"
    idioms:
      - "Swagger 2.0 JSON whose definitions `$ref` a shared types document by relative path
        (`../../../../../common-types/resource-management/v3/types.json#/definitions/Resource`),
        both sides full documents"
      - "a service split into keyvault.json, common.json, keys.json, secrets.json and
        managedHsm.json, each a document referencing common.json#/definitions/..."
      - "x-ms-examples: `$ref: ./examples/<operation>.json`, file references to JSON that is
        not a document"
      - "parameters and responses declared once at the document root and `$ref`'d from
        every operation"
  - name: kubernetes/kubernetes
    url: https://github.com/kubernetes/kubernetes.git
    ref: v1.36.5
    sha: ad950d1cc78b0183c476bd4d3f1934c104229727
    licence: Apache-2.0
    sparse: ["api/openapi-spec/v3/*.json"]
    idioms:
      - "63 machine-written OpenAPI 3.0 JSON documents, one per API group and version, each
        self-contained (components.schemas with 2,000+ cross-referencing entries)"
      - "operations with an operationId and a per-verb path (GET /apis/apps/v1/namespaces/{namespace}/deployments)"
      - "schemas named by dotted Go package (io.k8s.api.apps.v1.Deployment) and `$ref`'d from
        other schemas and from operations' request bodies and responses"
      - "securitySchemes (BearerToken) and no file $refs at all"
