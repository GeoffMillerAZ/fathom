# IaC provider catalog pins (IF-5, docs/plans/iac-facts.md; ADR-091).
#
# One catalog is built per provider major line (IF-M0 A2): it holds every stable release of the line, so exact-version
# binding reaches every lockfile selection whose line an operator has added. A pin names a release by version and by
# the sha256 of its provider archive for `platform`. cmd/iaccatalog refuses an archive whose sha256 differs.
#
# This file pins one or two releases per provider so the builder and its receipt can be exercised end to end. Widening
# a line to every stable release is data, not code: IF-P8 measures the cost first, and IF-6 publishes only if the
# 32 MiB and 500,000-entry bars hold. `licence` stays empty until IF-11 audits each provider at its pin.
#
# Values: the registry's own download metadata for platform linux_amd64, read 2026-11-04.
registry: registry.opentofu.org
platform: linux_amd64
providers:
