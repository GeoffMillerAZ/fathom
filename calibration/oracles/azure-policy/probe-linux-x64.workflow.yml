# Controller copies this onto a disposable run branch, which is never merged.
name: Azure Policy authored Linux x64 probe
on: [push]
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Probe with private diagnostics
        id: probe
        shell: bash
        run: bash calibration/oracles/azure-policy/run_probe_workflow.sh
      - name: Upload only validated counts, hashes and flags
        if: always() && steps.probe.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-policy-probe-receipt
          path: ${{ runner.temp }}/azure-policy-public/receipt.json
          if-no-files-found: error
          retention-days: 1
