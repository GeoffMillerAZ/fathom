    tree_sitter_grammar: none (a tree-sitter-cue grammar exists but is unnecessary given the first-party pure-Go parser)
    scip_indexer: none
    edges_feasible: true
    symbols:
      - package
      - import
      - definition (#Name)
      - hidden-definition (_name)
      - field
      - optional-field
      - alias
      - constraint/disjunction
      - attribute (@attr)
      - embedding
      - comprehension
      - reference-edge
      - import-edge
    repos:
      - name: cue-lang/cue
