          - disjunctions for typed enums
          - comprehensions generating resource lists
          - embeddings and unification across modules
          - attributes for tooling (@if, @embed)
      - name: holos-run/holos
        url: https://github.com/holos-run/holos
        ref: v0.99.3
        sha: 03b796312ada292e3fd2c4ccc5d82af5a766dc62
        license: Apache-2.0
        idioms:
          - deep package/import graphs
          - 'large #Definition hierarchies'
          - cross-file unification
          - disjunctions & constraints
          - comprehensions over component sets
          - field references across packages (qualified identifiers)
          - embeddings
