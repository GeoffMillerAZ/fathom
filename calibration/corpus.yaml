# fathom calibration corpus — curated public sample repos per language/tool.
#
# Purpose: real-world code to calibrate and stress-test fathom's extractors. Each
# repo is pinned to a real commit (sha resolved via `git ls-remote`; ref is the tag).
# `calibration/clone.sh` shallow-clones these into workspace/calibration/ (gitignored);
# `calibration/baseline.sh` measures the current extractors against them. See README.md.
#
# Per-language fields:
#   approach            pure-go-parser | tree-sitter | hybrid | structured-heuristic
#   go_parser_lib       authoritative pure-Go parser (Track A), or "none"
#   tree_sitter_grammar grammar for the wazero/WASM AST path (Track B), or "none"
#   scip_indexer        indexer that yields real call/reference edges, or "none"
#   edges_feasible      whether call/reference edges are realistically obtainable
#   symbols             the symbol kinds an *excellent* extractor should emit
#
# Two tracks fall out of this corpus:
#   Track A — pure-Go parsers (no WASM): Go, Dockerfile, Terraform/HCL, k8s YAML,
#     docker-compose, GitHub Actions, CUE, proto, GraphQL, SQL, JSON, TOML, Markdown.
#   Track B — tree-sitter via wazero (ADR-004): Java, Kotlin, Ruby, PHP, Scala, C,
#     C++, C#, Rust, Swift, Lua, Bash. Python/JS/TS/Helm are hybrid.
#
# Regenerate from a curation run with:
#   jq '.result.languages | map({...})' <run>.output | yq -p=json -o=yaml
# (curated 2026-06-15; 30 languages/tools, 83 repos).
languages:
  - language: Python
    category: language
    extensions:
      - .py
      - .pyi
    approach: hybrid
    go_parser_lib: none
    tree_sitter_grammar: tree-sitter/tree-sitter-python
    scip_indexer: sourcegraph/scip-python
    edges_feasible: true
    symbols:
      - functions
      - async functions
      - classes
      - methods
      - nested classes
      - decorators
      - module-level constants/variables
      - imports
      - from-imports (aliased)
      - type aliases
      - dataclasses
      - properties
      - class attributes / annotations
      - enums
    repos:
      - name: fastapi
        url: https://github.com/fastapi/fastapi
        ref: 0.119.1
        sha: 864b569cf8453654fc3bc2c64108c0f644e2918c
        license: MIT
        idioms:
          - heavy decorators (route decorators, Depends)
          - extensive type hints / generics (typing.Annotated)
          - Pydantic models (class-based with field annotations)
          - async def endpoints
          - dependency-injection callables
          - overloaded signatures (@overload)
          - module-level re-exports in __init__.py
          - TYPE_CHECKING-guarded imports
      - name: flask
        url: https://github.com/pallets/flask
        ref: 3.1.3
        sha: 8d05782cf7e01c815ceed85eac9d744533af4c44
        license: BSD-3-Clause
        idioms:
          - decorators (@app.route, @property)
          - metaclass-ish app/blueprint patterns
          - context-local proxies
          - class methods / classmethods / staticmethods
          - type-annotated public API
          - __all__ exports
          - nested helper functions / closures
      - name: django
        url: https://github.com/django/django
        ref: 5.2.9
        sha: f3e159479e30f77dd81683db9d94261a7bbf8789
        license: BSD-3-Clause
        idioms:
          - metaclasses (ModelBase, Field machinery)
          - deep multiple inheritance / mixins
          - descriptors and __get__/__set__
          - dynamically-generated methods
          - nested Meta classes
          - abstract base classes
          - extensive module-level imports and lazy imports
          - property descriptors
