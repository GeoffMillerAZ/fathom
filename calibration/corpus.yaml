  - language: SQL (schema/migrations)
    category: language
    extensions:
      - .sql
      - .ddl
    approach: pure-go-parser
    go_parser_lib: github.com/auxten/postgresql-parser (CockroachDB-derived pure-Go Postgres parser) or github.com/pganalyze/pg_query_go (libpg_query bindings, requires cgo); for broad multi-dialect coverage use github.com/xwb1989/sqlparser (Vitess-derived MySQL) — no single pure-Go parser covers all dialects
    tree_sitter_grammar: 'tree-sitter/tree-sitter-sql (community: DerekStride/tree-sitter-sql) as a dialect-agnostic fallback'
    scip_indexer: none
    edges_feasible: true
    symbols:
      - table
      - column
      - primary_key
      - foreign_key
      - unique_constraint
      - check_constraint
      - index
      - view
      - materialized_view
      - sequence
      - function
      - procedure
      - trigger
      - type
      - enum_type
      - schema
      - extension
      - alter_table_action
      - foreign_key_ref
      - create/alter/drop_statement
    repos:
      - name: gitlabhq/gitlabhq
        url: https://github.com/gitlabhq/gitlabhq
        ref: v17.9.8
        sha: c5528377549d5edd0b699c4d66afc8924c9684b5
        license: MIT (MIT Expat for the main tree; doc/ is CC-BY-SA, ee/ has separate license — exclude those dirs)
        idioms:
          - enormous Postgres DDL dump (hundreds of tables)
          - foreign keys with ON DELETE/UPDATE actions
          - composite and partial indexes
          - CHECK constraints
          - partitioned tables
          - sequences and ownership
          - triggers and functions (PL/pgSQL)
          - ALTER TABLE migrations
          - extensions (CREATE EXTENSION)
          - schema-qualified identifiers
          - Postgres-specific types
      - name: sqitchers/sqitch
        url: https://github.com/sqitchers/sqitch
        ref: v1.6.1
        sha: 396d10f99a95b23cde3a19bd78ed95f08978da92
        license: MIT
        idioms:
          - multi-dialect SQL (Postgres, MySQL, SQLite, Oracle, Snowflake, Firebird, Vertica, Exasol)
          - deploy/revert/verify change-script triads
          - registry DDL (tables, indexes, foreign keys, functions)
          - engine-specific syntax differences
          - transactional DDL blocks (BEGIN/COMMIT)
          - BEGIN/END procedural blocks
      - name: lerocha/chinook-database
        url: https://github.com/lerocha/chinook-database
        ref: v1.4.5
        sha: 4a944a942426e1f3263fe539155fb7ef92b04b4a
        license: MIT (custom-formatted MIT text in LICENSE.md; GitHub reports NOASSERTION but the terms are MIT)
        idioms:
          - the same schema emitted across many dialects (SQL Server, MySQL, Postgres, SQLite, Oracle, DB2)
          - CREATE TABLE with foreign keys and referential actions
          - primary/foreign key constraints
          - indexes
          - identity/auto-increment columns across dialects
          - quoting and identifier-style differences
          - mixed DDL+DML files
