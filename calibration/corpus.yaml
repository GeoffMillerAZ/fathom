        sha: a02ef5abb5cf8d37a3f1e442f061885532fc6461
        license: Apache-2.0
        idioms:
          - definitions (#Foo) and hidden defs (_foo)
          - field constraints and disjunctions (a | b)
          - comprehensions (for/if)
          - embeddings
          - imports & package clauses
          - string interpolation \()
          - lists & list comprehensions
          - open/closed structs
          - optional fields (?:)
          - default values (*)
          - attributes (@attr)
          - references & aliases (X=...)
      - name: stefanprodan/timoni
        url: https://github.com/stefanprodan/timoni
        ref: v0.9.0
        sha: b896bce4f078f00f4464a0147c145063251eb5f1
        license: Apache-2.0
        idioms:
