# fathom's own project config.toml (docs/plans/config-experience.md CF-1).
#
# O63 item 5 / internal/statedir: runtime state (session logs, observed-
# discovery logs, retro/narrate artifacts, the receipts log, MCP call
# logs) defaults to OUTSIDE a repository's own tree
# ($XDG_STATE_HOME/fathom/<repo-id>/) so a fresh adopter's `git status`
# never shows hook output. fathom's own repository is the one deliberate
# exception: its Taskfile and docs (docs/usage.md's workspace/ convention)
# already treat workspace/ as the gitignored home for every fathom
# artifact, including its own call log (doctor.go's isFathomSourceTree
# self-hosting checks read it there). Restoring the pre-O63 in-tree
# location here keeps that dev loop working unchanged.
[daemon]
state_dir = "workspace"

# CV-6 (docs/plans/refactor-conservation.md, design doc §1.1, O114):
# `task tests:attest` writes its commit-bound envelope here; a plain
# `fathom ingest` picks it up from this directory automatically.
[tests]
results_dir = "workspace/artifacts/test-results"

# EW-9 (docs/plans/efficiency-wave.md, stop 1): this repository turns on the
# test-run hook (ADR-056 decision 6, docs/configuration.md "The test-run
# hook"): tiers 0 and 1, provider none. A failing run of a declared test
# command (Taskfile test tasks and the `go test` they invoke) gets one line
# naming the failing tests and the changed symbols they reach. It fires only
# once .claude/settings.json carries the two test-run hook rows `fathom init`
# writes, from a deployed binary that knows `--event test-run`.
[hooks]
test_run = true

# [[surface.pattern]] (ADR-044 §2.1, CV-26): this repository's own
# capability-inventory sources that no built-in kind (api/json/route/env/
# rpc/cli) derives — fathom's CLI verbs register themselves, each from an
# init() in its own cmd/fathom file calling `declareVerb(verb{Name: ...`
# (EW-45, cmd/fathom/verbs.go; never cobra), and MCP tools register through
# internal/mcp's own toolDescriptor literals (internal/mcp/dispatch.go).
# The tool regex is anchored on the literal `s.registerTool(toolDescriptor{`
# opener with `Name:` on the very next line (every real registration's own
# gofmt-multi-line shape) so it never picks up an unrelated struct that
# also happens to have a `Name` field on this package's own prompt
# arguments (promptArg{Name: ...}, internal/mcp/meta.go). `_test.go` files
# are excluded globally by Extract itself (a fakeBackend's own
# toolDescriptor literal never contributes).
[[surface.pattern]]
kind = "tool"
glob = "internal/mcp/*.go"
regex = 'registerTool\(toolDescriptor\{\s*\n\s*Name:\s*"([a-zA-Z_][a-zA-Z0-9_]*)"'

[[surface.pattern]]
kind = "verb"
glob = "cmd/fathom/*.go"
regex = 'declareVerb\(verb\{Name:\s*"([a-z][a-z0-9-]*)"'

# RT-145 (docs/design/responsible-tenant.md §4.2): discovery skips the
# default cache directories (.cache, .tools, target, dist, build,
# __pycache__, .venv, .gradle, .next, .turbo, coverage). This repository
# commits source under two of those names — the Go packages
# internal/analysis/coverage and third_party/agentic-kit/.../coverage, and
# dist/ (the shipped skills, dist/agents/skills/dist.go) — so it
# re-includes them.
[connector]
include = ["coverage", "dist"]

# EW-68 (docs/plans/efficiency-wave.md; owner ruling C1 on wave h5): the typed
# pass does not load fathom's measurement-only nested modules. Each is a
# calibration tool with its own third-party tree that no product entry
# reaches; wave h5's own-module rule (EW-62) made the four whose module path is
# fathom's plus their directory "own", and on a cold build cache their loads
# took stranger-check's init from 255 s to 1218-1697 s. Cold typed-load cost at
# 50783574 under the pass's own env (-p=1, GOMAXPROCS=1, GOMEMLIMIT=1GiB), each
# the module's marginal cost after the root module's load, with peak RSS
# (docs/bench/readings/efficiency-wave/typed-cold-cost.md):
#   calibration/oracles/prometheus     366.8 s  2.16 GB
#   calibration/oracles/alertmanager    43.1 s  0.52 GB
#   calibration/oracles/grafana          7.9 s  0.16 GB
#   calibration/telemetry-census         0.6 s  0.04 GB  (imports internal/promql to measure it)
# The other 39 calibration/oracles/* (module path fathom.bench/oracles/*)
# were not loaded before either (EW-62); their cold costs, same method:
#   kyverno 250.9s, gator 65.5s, helm 52.9s, pulumi-yaml-go 46.9s, envoy
#   15.0s, caddyfile 13.4s, flux 8.0s, otelcol 3.5s, github-actions 3.3s,
#   kubernetes 1.4s, traefik 1.2s, clang-includes 0.8s, clang-ast-defs 0.7s,
#   jaxrs 0.6s, clang-calls 0.6s, kong 0.6s, cargo 0.6s, crossplane 0.6s, npm
#   0.6s, protoc-descriptors 0.6s, cue 0.5s, gitlab-ci 0.5s, timoni 0.5s,
#   terraform 0.5s, ansible 0.5s, lefthook-dump 0.5s, cedar 0.4s, maven 0.4s,
#   gradle 0.4s, taskfile 0.4s, go-mod 0.3s, kustomize 0.3s, docker-compose
#   0.2s, scip-clang/preproc 0.2s, spring 0.2s, vcpkg-depend 0.2s, msbuild
#   0.2s, opa-parse 0.2s, argo (fails to load: its go.mod needs go 1.26.5)
[typed]
skip_modules = ["calibration/oracles/**", "calibration/telemetry-census"]
