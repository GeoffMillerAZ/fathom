# Release binaries (DS-3). When a GitHub release is published, one macos-14
# runner builds darwin/arm64, darwin/amd64 (cgo, ADR-066) and linux/amd64,
# linux/arm64 (CGO_ENABLED=0) with GoReleaser (.goreleaser.yaml) and APPENDS
# the archives and checksums.txt to that release; the notes `gh release
# create` wrote are kept (release.mode: keep-existing). workflow_dispatch
# re-runs a tag whose first attempt failed. The only credential is the
# workflow's GITHUB_TOKEN. Nothing is signed or notarized, but the archives and
# checksums.txt carry a build-provenance attestation (SLSA, via GitHub's
# Sigstore), starting with the first release after v0.23.0:
# `gh attestation verify <archive> --repo GeoffMillerAZ/fathom --signer-workflow GeoffMillerAZ/fathom/.github/workflows/release.yml`.
# Permissions are none at the workflow level and granted per job.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and attach assets to, e.g. v0.12.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  binaries:
    name: GoReleaser (darwin + linux)
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write # upload assets to the existing release
      id-token: write # keyless signing of the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # the attested build must not restore a cache shared with CI

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      # GoReleaser's output directory comes from .goreleaser.yaml so the
      # attested subjects cannot drift from where the archives are written.
      - name: Resolve GoReleaser dist
        id: dist
        run: echo "path=$(sed -n 's/^dist:[[:space:]]*//p' .goreleaser.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.dist.outputs.path }}/checksums.txt
            ${{ steps.dist.outputs.path }}/fathom_*.tar.gz
