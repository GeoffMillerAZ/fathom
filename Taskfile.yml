version: '3'

# Uniform command runner for fathom. `task validate` is the full gate
# (also run by lefthook pre-push). fathom is pure Go (ADR-066, superseding
# ADR-013): internal/store is modernc.org/sqlite (ADR-020/025) and every
# tree-sitter grammar runs as WASM under wazero (ADR-048), so on Linux every
# build is CGO_ENABLED=0 and needs no C toolchain. darwin keeps cgo for
# cmd/fathom's two proc readers alone (host_darwin.go, rss_darwin.go:
# proc_pid_rusage and proc_listchildpids have no pure-Go path); a darwin
# build without cgo still works, through host_other.go and rss_other.go.
# The one Linux exception is `-race`: Go's race detector needs cgo there, so
# the race runs below set CGO_ENABLED=1 inline, and `task validate` on Linux
# needs a C compiler while `task build` does not. cmd/fathom/cgofree_test.go
# guards the dependency set (CS-9).

env:
  # The default per OS. Task lets the OS environment win over this block (see
  # store-purego), so an exported CGO_ENABLED still decides; `task build`
  # pins Linux to 0 regardless.
  CGO_ENABLED: '{{if eq OS "darwin"}}1{{else}}0{{end}}'
  # The darwin binary's minimum macOS. With cgo the link is external and
  # clang stamps LC_BUILD_VERSION minos from this variable; unset, it stamps
  # the build host's own version (measured 2026-10-10 on macOS 27: minos 27.0,
  # so the binary refuses older macOS; ld printed no warning either way).
  # A pure-Go build ignores it (minos 12.0, Go's floor). Harmless on Linux.
  MACOSX_DEPLOYMENT_TARGET: '14.0'

vars:
  # The wrapper preserves normal Go behavior when FATHOM_CACHE_ROOT is unset.
  # When configured, every Taskfile Go invocation uses that dedicated root
  # and enforces FATHOM_CACHE_MAX_MIB (default 8192) on the build cache.
  GO: bash scripts/fathom-go.sh
  # Go files we own — exclude tmp/ scans, ref/ external clones, workspace/ (build
  # artifacts + calibration clones), _reference/ copies, testdata/ fixtures, and
  # third_party/ (the kit mirrors — upstream's code, upstream's formatting;
  # drift from the pinned commit is vendor-check's job, not gofmt's). Since
  # ADR-070 the mirrors are packages of this module, so every `./...` below
  # is narrowed to `go list ./... | grep -v /third_party/`: kit code is never
  # reformatted, vetted or tested here, only built (its tests run in the
  # kit's own CI).
  GOFILES:
    sh: find . -name '*.go' -not -path './.claude/*' -not -path './tmp/*' -not -path './ref/*' -not -path './workspace/*' -not -path './third_party/*' -not -path '*/_reference/*' -not -path '*/testdata/*' 2>/dev/null | tr '\n' ' '

tasks:
  default:
    cmds: [task --list]
    silent: true

  t:
    desc: Run selected packages with race detection (task t [RUN=pattern] -- PACKAGES)
    silent: true
    env:
      FATHOM_TEST_RUN: '{{.RUN | default ""}}'
    cmds: ['bash scripts/test-targeted.sh {{.CLI_ARGS}}']

  fmt:changed:
    desc: Check Go files changed against origin/main without rewriting them
    silent: true
    cmds: [bash scripts/fmt-changed.sh]

  merge-debris-check:
    desc: Reject conflict markers and tracked backup or reject files
    cmds: [bash scripts/check-merge-debris.sh]

  fmt:
    desc: Format all Go code
    cmds: ["{{.GO}} fmt $({{.GO}} list ./... | grep -v /third_party/)"]

  fmt-check:
    desc: Fail if any Go file (excluding tmp/ and _reference/) is not gofmt-clean
    cmds:
      - |
        files="{{.GOFILES}}"
        [ -z "$files" ] && exit 0
        bad=$(gofmt -l $files)
        if [ -n "$bad" ]; then echo "Not gofmt-clean:"; echo "$bad"; exit 1; fi

  vet:
    desc: go vet across fathom's own packages (third_party/ excluded, ADR-070)
    cmds: ["{{.GO}} vet $({{.GO}} list ./... | grep -v /third_party/)"]

  cue-vet:
    desc: Validate every CUE schema package (+ positive testdata)
    cmds:
      - |
        command -v cue >/dev/null 2>&1 || { echo "cue not installed — skipping"; exit 0; }
        found=0
        for schema in $(find . -name 'schema.cue' -not -path './.claude/*' -not -path './tmp/*' -not -path './ref/*' -not -path './workspace/*' -not -path './third_party/*' -not -path '*/cue.mod/*' -not -path '*/testdata/*' | sort); do
          found=1; d=$(dirname "$schema"); echo "cue vet: $d"
          (cd "$d" && cue vet ./...) || exit 1
        done
        # RP-2 (docs/plans/reach-parity.md): every shipped skill's SKILL.md
        # frontmatter vets against the vendored Agent Skills schema — the
        # standard is a schema under this gate, never a hand-written check.
        for skill in dist/agents/skills/*/SKILL.md; do
          fm=$(mktemp "${TMPDIR:-/tmp}/skill-frontmatter.XXXXXX")
          awk 'NR==1 && $0!="---"{exit 1} NR>1 && $0=="---"{exit} NR>1{print}' "$skill" > "$fm" || { echo "cue vet: $skill has no leading --- frontmatter"; rm -f "$fm"; exit 1; }
          mv "$fm" "$fm.yaml"
          echo "cue vet: $skill (frontmatter)"
          cue vet -d '#Frontmatter' schema/skills/schema.cue "$fm.yaml" || { echo "cue vet FAILED: $skill"; rm -f "$fm.yaml"; exit 1; }
          rm -f "$fm.yaml"
        done
        # LB-F1: every embedded dialect manifest vets against #Dialect.
        for manifest in internal/extractor/dialects/*/dialect.json; do
          [ -e "$manifest" ] || continue
          cue vet -d '#Dialect' schema/dialect/dialect.cue "$manifest" || { echo "cue vet FAILED: $manifest"; exit 1; }
        done
        # LB-F8: every doc-engine spec (shipped and the P20 parity specs)
        # vets against #Doc.
        for spec in internal/extractor/dialects/*/doc.json internal/extractor/testdata/doc/*.doc.json; do
          [ -e "$spec" ] || continue
          cue vet -d '#Doc' schema/dialect/dialect.cue schema/dialect/doc.cue "$spec" || { echo "cue vet FAILED: $spec"; exit 1; }
        done
        # LB-F108: the language queue vets against #Queue (a top-level JSON
        # list vets with -d '#Queue'; ADR-018: JSON authors, CUE validates).
        cue vet -d '#Queue' schema/langqueue/schema.cue docs/plans/language-breadth.queue.json || { echo "cue vet FAILED: docs/plans/language-breadth.queue.json"; exit 1; }
        # FD-3 (docs/plans/fathom-dir.md): this repository's .fathom/*.cue
        # vet as ONE value against #Project (docs/design/fathom-dir.md s5).
        # risk.cue and learning.cue are mapped by file name, not key, so each
        # vets on its own. Instance files are exported to JSON first because
        # `cue vet -d` validates data files only; CUE files would be unified
        # into the schema instead of checked against it.
        proj=$(mktemp -d "${TMPDIR:-/tmp}/project-vet.XXXXXX")
        keyed=$(ls .fathom/*.cue 2>/dev/null | grep -v -e '/risk.cue$' -e '/learning.cue$')
        if [ -n "$keyed" ]; then
          echo "cue vet: .fathom/*.cue (#Project)"
          cue export --out json $keyed > "$proj/project.json" && cue vet -d '#Project' schema/project/schema.cue "$proj/project.json" || { echo "cue vet FAILED: .fathom/*.cue as #Project"; rm -rf "$proj"; exit 1; }
        fi
        [ -e .fathom/risk.cue ] && { cue export --out json .fathom/risk.cue > "$proj/risk.json" && cue vet -d '#RiskTable' schema/risk/schema.cue "$proj/risk.json" || { echo "cue vet FAILED: .fathom/risk.cue"; rm -rf "$proj"; exit 1; }; }
        [ -e .fathom/learning.cue ] && { cue export --out json .fathom/learning.cue > "$proj/learning.json" && cue vet -d '#Learning' schema/learning/schema.cue "$proj/learning.json" || { echo "cue vet FAILED: .fathom/learning.cue"; rm -rf "$proj"; exit 1; }; }
        # The commented negatives in schema/project/testdata/invalid.cue:
        # each must be rejected, so a #Project that went open would fail here.
        for bad in '{"made_up_key": true}' '{"budgets": {"list": 0}}' '{"concerns": {"c": {"check": {"kind": "nope"}}}}'; do
          echo "$bad" > "$proj/bad.json"
          if cue vet -d '#Project' schema/project/schema.cue "$proj/bad.json" >/dev/null 2>&1; then echo "cue vet FAILED: #Project accepted $bad"; rm -rf "$proj"; exit 1; fi
        done
        rm -rf "$proj"
        [ "$found" = 0 ] && echo "no schema.cue files yet"; exit 0

  test:
    desc: Run all tests (-race, with cgo on)
    # CGO_ENABLED=1 inline (ADR-066): Linux's race detector needs cgo (and a
    # C compiler), and on darwin cgo compiles host_darwin.go and
    # rss_darwin.go, whose tests run only there. The shipped Linux binary is
    # pure Go; the cgo it tests under touches only the standard library's
    # net and os/user (cmd/fathom/cgofree_test.go, CS-9).
    # RT-129 (§12.3): -p 4 bounds how many package test binaries run at
    # once on a machine other gates and agents share.
    # PE-28 (O121): every test run below goes through scripts/scratch-home.sh,
    # which gives it a FATHOM_HOME under workspace/tmp/ (removed afterwards; a
    # caller's own wins), so a test that reaches a per-user ledger or record
    # never writes the operator's ~/.fathom.
    # cmd/fathom (~1,900 serial tests, ~357 s alone: the gate's critical
    # path) runs as FATHOM_TEST_SHARDS (default 4) shards of ONE race build
    # through scripts/test-shards.sh, balanced by the measured seconds in
    # scripts/test-shards.weights.tsv (`task test:weights` refreshes them);
    # every other package runs through the go test line below. The two run
    # CONCURRENTLY: at most 4 package test binaries plus 4 shards, 8 test
    # processes at peak (fewer once the short packages finish), still one
    # gate per machine under the lease and niced (RT-129).
    # Measured 2026-09-30 under the lease at load ~11-13: concurrent 356 s,
    # shards after the packages 463 s and 476 s (internal/fusion, ~270-290 s,
    # was the other long pole either way). After the slowest tests moved to
    # sibling packages, at load 10-15: 338 s; shards 231 s with their build,
    # internal/fusion/perfgate 218 s, internal/fusion 137 s.
    # internal/fusion/perfgate is NOT in this -race line: it measures wall
    # time against a bound, and under -race that time is the race
    # detector's. It runs in its own `perfgate` step (no -race), a
    # validate:unleased dependency.
    # The go test line stays literal in this task: the test-run hook
    # (cmd/fathom/testrunhook_declared.go) reads the declared test commands
    # from this Taskfile.
    cmds:
      - |
        export CGO_ENABLED=1
        rc=0
        pkgs=$({{.GO}} list ./... | grep -v '/cmd/fathom$' | grep -v '/internal/fusion/perfgate$' | grep -v /third_party/) || exit 1
        mkdir -p workspace/tmp
        shardout=$(mktemp workspace/tmp/test-shards-out.XXXXXX)
        bash scripts/scratch-home.sh bash scripts/test-shards.sh >"$shardout" 2>&1 & shards=$!
        bash scripts/scratch-home.sh {{.GO}} test -race -p 4 $pkgs || rc=$?
        wait $shards || rc=1
        cat "$shardout"; rm -f "$shardout"
        exit $rc

  perfgate:
    desc: The typed-edges performance gate (internal/fusion/perfgate) WITHOUT -race - it times the typed pass against a syntax-only baseline, and under -race it would time the race detector. Every other package, internal/fusion included, stays under -race in `task test`; this package is excluded from that line and runs here, in validate:unleased
    cmds: ["bash scripts/scratch-home.sh {{.GO}} test -count=1 ./internal/fusion/perfgate/..."]

  test:weights:
    desc: Re-measure cmd/fathom's per-test seconds into scripts/test-shards.weights.tsv (the shard balance of `task test`) from one go test -race -json run
    cmds:
      - |
        rc=0
        mkdir -p workspace/tmp
        bash scripts/scratch-home.sh {{.GO}} test -race -count=1 -json ./cmd/fathom >workspace/tmp/test-weights.json || rc=$?
        bash scripts/test-shards.sh weights workspace/tmp/test-weights.json || exit 1
        exit $rc

  test-unit:
    desc: Fast unit tests only (-short)
    cmds: ["bash scripts/scratch-home.sh {{.GO}} test -short $({{.GO}} list ./... | grep -v /third_party/)"]

  test-integration:
    desc: Integration tests (Faux-backed end-to-end)
    cmds: ["bash scripts/scratch-home.sh {{.GO}} test -race -run Integration $({{.GO}} list ./... | grep -v /third_party/)"]

  tests:attest:
    desc: >-
      Re-attest this repository's own suite with commit/dirty/race bound
      (CV-6, design doc §1.1, O114), plus a bound Go coverage profile for
      the reading set's execution evidence (CV-67, design doc §3.5): ONE
      `go test -json -coverpkg=<own> -coverprofile=<out>/coverage.out
      <own>` run (<own>: every package but third_party/'s, ADR-070), its JSON output converted by test-kit's go-test-json
      adapter (env TESTKIT_GO_JSON — the path to a built test-kit
      `surveyor` binary; a clear skip, never a failure, when unset),
      written under `[tests] results_dir`
      (workspace/artifacts/test-results/ — set it in .fathom/config.toml
      if this checkout predates it). This task never ingests the envelope
      itself: a plain `fathom ingest` (or `bin/fathom tests ingest
      --results workspace/artifacts/test-results`) picks it up on its own
      next run, the daemon's normal pickup path. TESTKIT_RACE=1 adds
      -race to the run and --race to the envelope (off by default — a
      full -race ./... run is slow, and this task's own job is producing
      a commit-bound envelope, not re-deciding this repo's race policy).
      TESTKIT_COVER=0 skips -coverpkg/-coverprofile and coverage.meta.json
      entirely — the plain pre-CV-67 run — for a checkout that only wants
      the envelope (`fathom conserve` falls back to static reach without
      one, design §3.5's own "Usable only when bound").
    cmds:
      - |
        set -eu
        if [ -z "${TESTKIT_GO_JSON:-}" ]; then
          echo "tests:attest: TESTKIT_GO_JSON is unset (path to a built test-kit 'surveyor' binary) — skipping. Build one from a platform-engineering checkout: go build -o /path/to/surveyor ./kits/test-kit/cmd/surveyor, then export TESTKIT_GO_JSON=/path/to/surveyor."
          exit 0
        fi
        [ -x "$TESTKIT_GO_JSON" ] || { echo "tests:attest: TESTKIT_GO_JSON=$TESTKIT_GO_JSON is not an executable file" >&2; exit 1; }
        out=workspace/artifacts/test-results
        mkdir -p "$out"
        commit=$(git rev-parse HEAD)
        dirty=false
        [ -z "$(git status --porcelain)" ] || dirty=true
        started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        raceflag=""; racearg=""
        if [ "${TESTKIT_RACE:-0}" = "1" ]; then raceflag="-race"; racearg="--race"; fi
        dirtyarg=""
        [ "$dirty" = true ] && dirtyarg="--dirty"
        own=$({{.GO}} list ./... | grep -v /third_party/)
        coverflags=""
        if [ "${TESTKIT_COVER:-1}" != "0" ]; then
          coverflags="-coverpkg=$(echo $own | tr ' ' ',') -coverprofile=$out/coverage.out"
        fi
        # A prior meta+profile pair is removed BEFORE the run starts —
        # never left in place across it — so a run killed mid-test (a
        # hard kill: CI timeout, OOM) never leaves an OLD, valid-looking
        # meta paired with a NEW, truncated-or-partial coverage.out (go
        # test truncates/rewrites it the moment coverage instrumentation
        # starts writing). Without one, `fathom conserve` correctly reads
        # "not configured" rather than a stale pairing (I44).
        if [ -n "$coverflags" ]; then
          rm -f "$out/coverage.meta.json"
        fi
        testrc=0
        {{.GO}} test -json $raceflag $coverflags $own > "$out/go-test.jsonl" || testrc=$?
        # coverage.meta.json is written HERE, right after go test itself
        # exits and BEFORE the surveyor ingest step below — never after
        # it. Under `set -eu`, an ingest failure aborts the script; if
        # the meta write happened only after ingest succeeded, that
        # abort would leave THIS run's freshly-overwritten coverage.out
        # paired with the PREVIOUS run's meta (an earlier commit, or a
        # passed=true meta over a profile from a run that actually
        # failed) — I44 forbids exactly that pairing, and the previous
        # ordering could produce it.
        if [ -n "$coverflags" ]; then
          passed=true
          [ "$testrc" -eq 0 ] || passed=false
          race=false
          [ "${TESTKIT_RACE:-0}" = "1" ] && race=true
          printf '{\n  "schema": "fathom.coverage/v1",\n  "commit": "%s",\n  "dirty": %s,\n  "race": %s,\n  "profile": "coverage.out",\n  "passed": %s\n}\n' \
            "$commit" "$dirty" "$race" "$passed" > "$out/coverage.meta.json"
          echo "tests:attest: wrote $out/coverage.meta.json + $out/coverage.out (passed=${passed})"
        fi
        "$TESTKIT_GO_JSON" ingest --format go-test-json \
          --component fathom --suite unit --class unit \
          --started-at "$started" --commit "$commit" $dirtyarg $racearg \
          < "$out/go-test.jsonl" > "$out/envelope.json"
        echo "tests:attest: wrote $out/envelope.json bound to commit ${commit} (dirty=${dirty}, race=${TESTKIT_RACE:-0})"
        echo "tests:attest: a plain 'fathom ingest' (or the daemon's next ingest) picks this up from [tests] results_dir; to ingest it right now: bin/fathom tests ingest --service fathom --store <store> --manifest . --results $out"

  merge-drivers:
    desc: Set the repo-local merge driver .gitattributes names for generated files (keeps the current side; run `task regen` after a merge). Idempotent
    cmds:
      - git config merge.fathom-regen.name "regenerate, do not merge"
      - git config merge.fathom-regen.driver true

  lang:loop:
    desc: Probe, measure, regrade and render one language queue item without writing by default
    env:
      LANG_LOOP_ROOT: '{{.LANG_ROOT | default "."}}'
      LANG_LOOP_SUBJECT: '{{.SUBJECT | default ""}}'
      LANG_LOOP_WRITE: '{{.WRITE | default "0"}}'
      LANG_LOOP_READING: '{{.READING | default ""}}'
      LANG_LOOP_ORACLES: '{{.ORACLE_CONFIG | default ""}}'
    cmds:
      - |
        write=false
        if [ "$LANG_LOOP_WRITE" = 1 ]; then write=true; fi
        {{.GO}} run -p 4 ./cmd/indexbench lang-loop -root "$LANG_LOOP_ROOT" -subject "$LANG_LOOP_SUBJECT" -write="$write" -reading "$LANG_LOOP_READING" -oracle-config "$LANG_LOOP_ORACLES" {{.CLI_ARGS}}

  regen:
    desc: Regenerate every committed generated file, in a fixed order (the language board, then the grammar provenance tables)
    cmds:
      - go run ./cmd/indexbench lang-tracker > docs/languages.md.tmp && mv docs/languages.md.tmp docs/languages.md
      - go run ./cmd/indexbench provenance > internal/extractor/tsengine/grammars/PROVENANCE.md.tmp && mv internal/extractor/tsengine/grammars/PROVENANCE.md.tmp internal/extractor/tsengine/grammars/PROVENANCE.md

  scripts-check:
    desc: bash -n every scripts/*.sh (syntax gate — A2-2's skip note depends on this running in CI via task validate), the script tests, and the app-kit mirror's closure manifest (DS-4)
    cmds:
      - |
        rc=0
        for f in scripts/*.sh scripts/gdev/*.sh; do
          bash -n "$f" || { echo "bash -n FAILED: $f"; rc=1; }
        done
        [ "$rc" -eq 0 ] || exit "$rc"
        bash scripts/check-merge-debris_test.sh
        bash scripts/commit-msg-check_test.sh
        bash scripts/boundary-hooks_test.sh
        bash scripts/ci-boundary_test.sh
        bash scripts/targeted-tasks_test.sh
        bash scripts/build-cache_test.sh
        bash scripts/deploy-wait_test.sh
        bash scripts/gate-lease_test.sh
        bash scripts/prepush-refs_test.sh
        bash scripts/test-shards_test.sh
        bash scripts/scratch-home_test.sh
        bash scripts/gdev/cold-arm_test.sh
        bash scripts/tenancy-stress_test.sh
        bash scripts/pipefail-grep_test.sh
        bash scripts/cloud-setup_test.sh
        bash scripts/kit-closure_test.sh
        bash scripts/kit-closure.sh --check
        bash calibration/clone_test.sh
        bash third_party/agentic-kit/fathom-pack/scripts/push-check_test.sh
        bash third_party/agentic-kit/fathom-pack/scripts/push-http_test.sh

  ui:css:
    desc: Rebuild the standalone observatory CSS from the in-tree app-kit mirror (no Node or sibling checkout)
    cmds:
      # The script builds appkit inside third_party/app-kit with GOWORK=off,
      # validates the closed source set, stages both outputs, then publishes.
      - bash scripts/ui-css.sh

  validate:
    desc: Full gate under the machine-wide gate lease, at background priority (RT-129) — see validate:unleased
    # RT-129 (§12.3): concurrent gates on one machine queue on one flock
    # (~/.fathom/locks/gate.lock; FATHOM_GATE_LOCK overrides) and run under
    # nice -n 10 (FATHOM_GATE_NICE=off opts out; =background is macOS
    # taskpolicy -b, ~3x slower — see scripts/gate-lease.sh).
    cmds: ["bash scripts/gate-lease.sh task validate:unleased"]

  validate:unleased:
    desc: Full gate — merge-debris-check, fmt-check, vet, cue-vet, vendor-check, testkit-schema-check, clean-clone-check, stranger-check, store-purego, scripts-check, config-audit, intent-index-check, intent-guard-check, bench-l0-gate, tenancy-lint, perfgate, test
    # clean-clone-check is IN the gate, not a nice-to-have: the adopter build
    # broke silently once (go.work committed, app-kit unmirrored) and stayed
    # broken because every machine that ran validate had the siblings.
    # stranger-check (RP-23) is the same lesson one step further: the copy
    # must init and pass doctor for someone who is not the author. Measured
    # 26–43s on 2026-09-02; the whole-tree first index then grew it to
    # 392-1132s and past init's wait under load, so since O1339 init wires
    # the fixture fleet: 95s on 2026-10-19, nearly all of it the build.
    # scenariobench is not a dep: `task test` already runs
    # ./internal/scenariobench (race, under the test task's CGO_ENABLED=1), and
    # the dep ran it a second time (77–102 s each, measured 2026-09-30).
    deps: [merge-debris-check, fmt-check, vet, cue-vet, vendor-check, testkit-schema-check, clean-clone-check, stranger-check, store-purego, scripts-check, config-audit, intent-index-check, intent-guard-check, bench-l0-gate, tenancy-lint, changelog-check, perfgate]
    cmds: [{ task: test }]

  push:
    desc: "Gated push (I40/I41, agentic-kit fathom-pack push gates — docs/project-intent/operating.md §5 in the vendored kit): refuses without the lefthook pre-push hook, then pushes HEAD:main over smart HTTP derived from origin"
    cmds:
      - bash third_party/agentic-kit/fathom-pack/scripts/push-check.sh
      - bash third_party/agentic-kit/fathom-pack/scripts/push-http.sh HEAD:main

  scenariobench:
    desc: "Free — internal/scenariobench (the change-bench driver, vision 27/ADR-033): corpus load, category/prediction gate, fake-harness driver tests, plus internal/scenariobenchwired (the wired arm's real-binary hook proof, moved out of the package so it no longer sets its wall time). TestPublicScenarioCorpusIsDerived skips (never fails) when workspace/bench/sources/ is empty, the normal case on a fresh clone or CI."
    cmds: ["CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=14.0 {{.GO}} test -race ./internal/scenariobench/... ./internal/scenariobenchwired"]

  bench-l0-gate:
    desc: "Free, every commit (ADR-035 decision 5; docs/plans/verbs.md VB-6/VB-7/VB-17): the L0 index oracle (TestIndexOracleGoldens, internal/indexbench/testdata/l0-goldens.json), L1 payload replay (TestPayloadReplay, internal/indexbench/testdata/l1-replay.json), and the L0 freshness probe (TestFreshnessProbe, internal/indexbench/testdata/freshness-probe.json — vision 29 §3 wave D, M7) over the fauxtown fixture fleet, named as its own validate dependency rather than left to be swept in by the package-wide `go test ./...`. Fauxtown is three tiny services — measured well under a second — so no subset is pinned; if a future fixture fleet makes this slow, pin a subset here and say so in the golden's comment instead of dropping the gate."
    cmds: ["CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=14.0 {{.GO}} test -race -run 'TestIndexOracleGoldens|TestPayloadReplay|TestFreshnessProbe' ./internal/indexbench/..."]

  tenancy-lint:
    desc: "Free, every commit (design §4.7, RT-91/RT-92): the tenancy lint's syntactic rules over cmd/, internal/ and pkg/ (whole reads and walks in handler packages, whole-table loads, uncontexted exec, Background contexts in request-path files, bare goroutines, package-level maps, raw http.Serve, :7575 in tests, a test cmd.Env without os.Environ()), the allowlist in step with the tree's //fathom:tenancy-allow excuses, and the allowlist ratchet. Named as its own validate dependency, like bench-l0-gate, rather than left to the package-wide go test ./..."
    cmds: ["{{.GO}} test -count=1 ./internal/lint/tenancy/..."]

  changelog-check:
    desc: Change-note fragments lint - every file under docs/changelog/unreleased/ holds one known heading and at least one line, and CHANGELOG.md's [Unreleased] holds only the pointer line
    cmds:
      - "{{.GO}} run ./third_party/agentic-kit/cmd/release-notes -check"

  config-audit:
    desc: Custodian gate (invariants I16/I34/I37, PC-14) — this repo's own agent config holds every concern in .fathom/concerns.cue; a down daemon reads unable-to-check, never a violation
    deps: [build]
    cmds:
      - bin/fathom config audit --repo .

  intent-guard-check:
    desc: Edit-time intent gate (IV-3a, ADR-074 decision 6) — .fathom/guard.cue's generated intent entries match the router's sensitive-surface table (one map, not two); drift exits 1 naming the first entry. Fix with bin/fathom intent export --guard --write, in the same commit as the router change
    deps: [build]
    cmds:
      - bin/fathom intent export --guard --check

  intent-index-check:
    desc: Decisions-index parity gate (IV-2, ADR-074) — every ADR-NNN heading of ADR.md has exactly one row in docs/intent/decisions/README.md and every row names a heading; drift exits 1 naming each id and the side that lacks it
    deps: [build]
    cmds:
      - bin/fathom intent index --check

  sync-kit:
    desc: Re-archive the private siblings (agentic-kit, app-kit) into third_party/ at each sibling's HEAD (the pin bump; one kit at a chosen commit is `bash scripts/sync-vendor.sh <kit> <commit>`), rewritten into this module by cmd/kitrewrite (ADR-070) and stamped in .vendor-commit; app-kit's copy is then reduced to fathom's build closure, computed into third_party/app-kit.keep by scripts/kit-closure.sh (DS-4); app-kit is skipped with one line when no ../app-kit checkout (or $APP_KIT_SIBLING) exists
    cmds:
      - bash scripts/sync-vendor.sh agentic-kit
      - |
        if [ -d "${APP_KIT_SIBLING:-../app-kit}/.git" ]; then
          bash scripts/sync-vendor.sh app-kit
        else
          echo "sync-kit: skipping app-kit, no checkout at ${APP_KIT_SIBLING:-../app-kit} (set APP_KIT_SIBLING to point elsewhere)"
        fi

  clean-clone-check:
    desc: Adopter guard — the committed tree must build with no sibling checkouts and no go.work
    cmds: ["bash scripts/clean-clone-check.sh"]

  vendor-check:
    desc: Drift guard — assert each kit mirror, reverse-rewritten (cmd/kitrewrite -reverse), matches the commit its .vendor-commit pins, app-kit's on only the paths third_party/app-kit.keep lists (skips gracefully without the sibling checkouts)
    cmds: ["bash scripts/vendor-check.sh"]

  testkit-schema-check:
    desc: "Drift guard (vision 33 / ADR-043 stage 0, TC-1) — assert schema/testkit/{manifest,result}.cue match the commit schema/testkit/.vendor-commit pins from platform-engineering/kits/test-kit (skips gracefully without the sibling)"
    cmds: ["bash scripts/testkit-schema-check.sh"]

  stranger-check:
    desc: "Adopter guard (RP-23) — copy the tracked tree to $TMPDIR (outside the module, so a parallel `go vet ./...` never walks it), build with GOWORK=off, run `fathom init --harness=none --skills` on a stranger's repository (the fauxtown fleet as its own git repo, a fixed first index: O1339) and `fathom doctor` against a throwaway daemon + temp store with a temp HOME; fail on any FAIL row or a binary_fresh against the copy that is not PASS. Its stubbed test runs first. Prints its elapsed seconds."
    cmds: ["bash scripts/stranger-check_test.sh", "bash scripts/stranger-check.sh"]

  store-purego:
    desc: Purity guard (invariant I2, ADR-025) — internal/store must build and pass -race under CGO_ENABLED=0
    # The override lives in the shell line, not a Taskfile `env:` block — Task
    # lets the OS environment win over Taskfile env, so a login shell exporting
    # CGO_ENABLED=1 would silently turn an env: override into a cgo build and
    # this guard into a no-op (it would even share the cgo test cache).
    # Go's race detector runs without cgo only on macOS (Go 1.20+); on Linux
    # (a cloud session VM, docs/adoption/cloud-sessions.md) `-race` under
    # CGO_ENABLED=0 refuses to start, so there the purity build and tests run
    # without -race and `task test` races internal/store under cgo. macOS is
    # unchanged.
    cmds:
      - |
        if [ "$(uname -s)" = Darwin ]; then
          CGO_ENABLED=0 {{.GO}} test -race ./internal/store/
        else
          CGO_ENABLED=0 {{.GO}} test ./internal/store/
        fi

  doctor:
    desc: Toolchain + workspace health
    cmds:
      - 'echo "go:        $({{.GO}} version)"'
      - 'echo "cgo:       CGO_ENABLED=$CGO_ENABLED"'
      - 'echo "cue:       $(cue version 2>/dev/null | head -1 || echo missing)"'
      - 'echo "lefthook:  $(lefthook version 2>/dev/null || echo missing)"'
      - 'echo "agentic-kit: $(cat third_party/agentic-kit/.vendor-commit 2>/dev/null || echo missing)"'
      - 'echo "app-kit:   $(cat third_party/app-kit/.vendor-commit 2>/dev/null || echo missing)"'
      - 'echo "packages:  $({{.GO}} list ./... 2>/dev/null | wc -l | tr -d " ")"'

  build:
    desc: Build the fathom CLI to bin/fathom — the path every wiring mechanism expects (post-commit rebuild hook, init's baked-in hook commands, the daemon-install pattern; see docs/adoption/claude-code.md)
    # Pure Go off darwin, whatever the shell exports (ADR-066); darwin follows
    # CGO_ENABLED (default 1, for the two proc readers).
    cmds:
      - "{{if ne OS \"darwin\"}}CGO_ENABLED=0 {{end}}{{.GO}} build -o bin/fathom ./cmd/fathom"

  deploy:
    desc: "Build, install to ~/.local/libexec/fathom/fathom, restart the launchd daemon, then ASSERT the running process is the freshly built binary — the missing link between 'committed a daemon fix' and 'agents actually get it'"
    deps: [build]
    cmds:
      # The daemon must run an INSTALLED copy, never bin/fathom directly: a
      # post-commit rebuild would otherwise swap the binary out from under
      # launchd's KeepAlive. Write to a temp path and rename — `cp` over a
      # running executable truncates in place, which on macOS can fault the
      # live process's text pages.
      - mkdir -p "$HOME/.local/libexec/fathom"
      - cp -f bin/fathom "$HOME/.local/libexec/fathom/fathom.new"
      # Sign with the stable "fathom-dev" identity (O10 reopened 2026-08-08):
      # an AD-HOC binary's TCC/FDA grant pins the cdhash recorded at grant
      # time, so every rebuild silently voids it and the launchd daemon hangs
      # in an unpromptable tccd consult. A persistent identity makes the code
      # requirement identity-based — grant once, keep forever.
      # RT-147 (docs/design/responsible-tenant.md §8.4): no identity is a
      # FAILED deploy, never an ad-hoc install (the old `|| true` shipped a
      # binary whose grant was void — INC-23's EPERM wedge). The staged
      # binary is removed and the running daemon is left untouched.
      - |
        if ! security find-identity -p codesigning -v | grep -q fathom-dev; then
          rm -f "$HOME/.local/libexec/fathom/fathom.new"
          echo "deploy FAILED: fathom-dev signing identity missing — refusing to install an ad-hoc binary (its TCC grant would be void). Create a 'fathom-dev' code-signing certificate in your login keychain (Keychain Access → Certificate Assistant → Create a Certificate, type Code Signing), then re-run task deploy. The running daemon is untouched." >&2
          exit 1
        fi
        codesign -s fathom-dev --force --timestamp=none "$HOME/.local/libexec/fathom/fathom.new"
      - mv -f "$HOME/.local/libexec/fathom/fathom.new" "$HOME/.local/libexec/fathom/fathom"
      # The operator's kill switch (`fathom daemon stop`) keeps the daemon
      # down on purpose: a kickstart would exit 0 at once and the health
      # check below would wait 60 s for nothing. Installed, not started.
      - |
        if [ -e "$HOME/.fathom/daemon/disabled.json" ]; then
          echo "deploy: installed the new binary, but the kill switch is set ($HOME/.fathom/daemon/disabled.json) — the daemon stays stopped on purpose. Run 'fathom daemon start' to start it on the new binary, then 'task deploy' again to assert it is serving." >&2
          exit 1
        fi
      # The label is this machine's, resolved — not assumed. `fathom daemon
      # status` prints it; an adopter with no agent gets `fathom daemon install`.
      # RT-156 (docs/design/responsible-tenant.md §8.5): a `deploy` intent
      # row (the pid being replaced, the new binary's hash) goes into the
      # lifecycle ledger BEFORE the kickstart, so a kickstart whose SIGTERM
      # does not reach a drained exit is not counted by the crash-loop
      # breaker (three agent deploys in 30 min would otherwise mean safe mode).
      - 'label=$(bin/fathom daemon status 2>/dev/null | awk "/^launchd agent:/ {print \$3}"); if [ -n "$label" ]; then bin/fathom daemon deploy-intent --label "$label" --binary "$HOME/.local/libexec/fathom/fathom"; launchctl kickstart -k gui/$(id -u)/"$label"; else echo "no launchd agent installed — run: fathom daemon install"; fi'

      # EW-17 (O129): the health wait outlasts launchd's respawn throttle
      # (throttle + exit timeout + a startup margin, read from launchd: the
      # installed agent's ThrottleInterval is 60 s, and the 30 one-second
      # tries this replaced exited 201 on two deploys whose daemon came up
      # 61 s later). A wait that runs out prints launchd's last exit reason
      # and job state instead of a bare timeout.
      # scripts/deploy-wait.sh is read-only against launchd and tested with a
      # fake launchctl (scripts/deploy-wait_test.sh).
      - |
        label=$(bin/fathom daemon status 2>/dev/null | awk "/^launchd agent:/ {print \$3}")
        bash scripts/deploy-wait.sh "$label"
      # Prove the deploy TOOK. Without these two asserts "I ran the deploy" and
      # "the daemon is serving new code" are different claims — which is exactly
      # how the daemon served 5-day-old code while doctor reported 11/11 PASS.
      - pgrep -fl 'fathom serve-http' | grep -q -- "$HOME/.local/libexec/fathom/fathom"
      - |
        got="$("$HOME/.local/libexec/fathom/fathom" version | sed -n 's/.*@ \([0-9a-f]*\).*/\1/p')"
        want="$(git rev-parse --short=12 HEAD)"
        [ "$got" = "$want" ] || { echo "deploy assert FAILED: daemon binary @ $got, HEAD $want" >&2; exit 1; }
        echo "✔ daemon is serving $got"

  build-dev:
    desc: Fast inner-dev-loop build to workspace/tmp/fathom — used by the calibration harness; not for hooks/daemon/MCP registration (those want bin/fathom via `task build`)
    cmds:
      - "{{.GO}} build -o workspace/tmp/fathom ./cmd/fathom"

  calibrate-clone:
    desc: "Shallow-clone the calibration corpus and calibration/corpus.d shards into workspace/ (optional filter: a language or shard id, e.g. task calibrate-clone -- Python swift)"
    cmds:
      - bash calibration/clone.sh {{.CLI_ARGS}}

  calibrate-clean:
    desc: "Delete one queue item's calibration clones (workspace/calibration/<id>/), e.g. task calibrate-clean -- swift (language-breadth §13.4)"
    cmds:
      - bash calibration/clean.sh {{.CLI_ARGS}}

  calibrate-baseline:
    desc: "Measure current extractors against the cloned corpus (optional LANG filter via -- )"
    deps: [build-dev]
    cmds:
      - bash calibration/baseline.sh {{.CLI_ARGS}}

  calibrate:
    desc: Clone the corpus and run the extractor baseline end-to-end
    cmds:
      - { task: calibrate-clone }
      - { task: calibrate-baseline }

  # ─── bench pyramid L0/L1 (FREE — no tokens, no daemon) ─────────────────
  # L0 (index oracle) and L1 (payload replay) over the fixture fleet are
  # plain Go tests in internal/indexbench, so `task test` already runs
  # them on every commit; `bench-l0-gate` above names the exact two tests
  # as their own `validate` dependency (ADR-035 decision 5, VB-6/VB-7), so
  # the gate is visible and runnable standalone. Only the self run below
  # is on demand: it type-checks and ingests the whole module, which is a
  # minute-scale cost the per-commit gate should not pay (ADR-032 §3.6).

  bench-l0-self:
    desc: "L0 index oracle over THIS repository at HEAD (free, on demand): precision/recall for find_callers, references and blast_radius against a go/types truth, written under workspace/artifacts/indexbench/"
    cmds:
      - mkdir -p workspace/artifacts/indexbench
      - >-
        GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/indexbench
        -root .
        -service indexbench-self
        -out workspace/artifacts/indexbench/self-$(date -u +%Y%m%dT%H%M%SZ).json
        {{.CLI_ARGS}}

  bench-l0-scip:
    desc: "Free. Typed-edge oracle against a SCIP index for a calibration subject: task calibrate-clone -- TypeScript first, then run scip-typescript in the clone (documented in docs/bench/scenarios.md), then this"
    cmds: ["GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/indexbench scip-oracle {{.CLI_ARGS}}"]

  bench-freshness-probe:
    desc: "Free (VB-17; docs/vision/29-verbs-not-lookups.md §3 wave D, M7): the L0 freshness probe standalone — N scripted mechanical edits (rename, add a parameter, delete, move, change a return literal) against a mutable fixture copy, each scored before and after the hash-gated re-ingest. Already runs on every commit inside bench-l0-gate; this target is for running it, and reading its numbers, on its own."
    cmds: ["CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=14.0 {{.GO}} test -race -v -run TestFreshnessProbe ./internal/indexbench/... {{.CLI_ARGS}}"]

  # ─── context-bench (COSTS REAL LLM TOKENS — operator-initiated only) ────
  # Every bench task below spends against the operator's Claude
  # subscription: one --trials 3 home run is roughly three times the
  # 2026-07-24 run's ~4.5M end-to-end tokens across both arms. autonomy.md
  # requires asking before LLM spend, so these are never wired into
  # `validate`, a hook, or CI.

  bench-home:
    desc: "COSTS TOKENS. Home-turf bench, 3 trials/cell, scored against the committed criterion (override: -- --trials 1)"
    cmds:
      - bash scripts/context-bench.sh --tasks testdata/contextbench/tasks-home.json --repeat 3 {{.CLI_ARGS}}

  bench-select:
    desc: "Free. Which home tasks a diff makes worth re-running (RANGE=origin/main...HEAD): the committed handler table maps changed files to agent-surface tools, tools to tasks."
    vars:
      RANGE: '{{.RANGE | default "origin/main...HEAD"}}'
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/contextbenchscore select -tasks testdata/contextbench/tasks-home.json -diff {{.RANGE}} {{.CLI_ARGS}}

  bench-targeted:
    desc: "COSTS TOKENS (a fraction of bench-home). Re-run only the tasks a diff can move, fathom arm only (RANGE=origin/main...HEAD). The row is scope=targeted and the evaluator refuses to turn it into a verdict."
    vars:
      RANGE: '{{.RANGE | default "origin/main...HEAD"}}'
    cmds:
      - |
        set -eu
        ONLY="$(GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/contextbenchscore select -tasks testdata/contextbench/tasks-home.json -diff {{.RANGE}} | tr '\n' ' ')"
        if [ -z "${ONLY// /}" ]; then
          echo "bench-targeted: {{.RANGE}} moves no task the corpus exercises — nothing to run, nothing to spend."
          exit 0
        fi
        echo "bench-targeted: running $ONLY (fathom arm only; the control arms' cells are borrowed by key)"
        bash scripts/context-bench.sh --tasks testdata/contextbench/tasks-home.json --repeat 3 \
          --only "$ONLY" --scope targeted --arms 'fathom' --stream {{.CLI_ARGS}}

  bench-lookup:
    desc: "COSTS TOKENS. Grep-native lookup bench (B1 corpus; no committed criterion, so no ledger row)"
    cmds:
      - bash scripts/context-bench.sh --tasks testdata/contextbench/tasks.json --trials 3 {{.CLI_ARGS}}

  bench-ledger:
    desc: Re-render docs/bench/README.md from the committed ledger (free — reads, never runs the bench)
    cmds:
      - bash scripts/bench-ledger-render.sh

  bench-regress:
    desc: "Regression gate over the committed ledger (free): newest row vs the previous same-corpus row; exit 1 if a task's treatment success fell, 3 if not comparable. Joins validate only once two same-corpus rows exist (ADR-031)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/contextbenchscore regress -ledger docs/bench/ledger.jsonl {{.CLI_ARGS}}

  # ─── scenario bench (vision 27, ADR-033; docs/bench/scenarios.md) ───────
  # One driver (cmd/scenariobench) over corpora under
  # testdata/scenariobench/*.json — an arm is data, never code (SB-11).
  # This wave ships testdata/scenariobench/public-go.json (SB-34); the
  # driver itself (SB-19) and guards-fathom.json (SB-24) land in other
  # waves of docs/plans/strengths-bench.md — these tasks are written ahead
  # of them, per that plan, so the commands are in place the day they do.
  # Costs follow vision 27 §9: free / targeted (~$20-40) / pilot (~$90-130).

  bench-scenario-plan:
    desc: "Free. Lists the public Go corpus's cells, their keys, and what would borrow by key — no spend."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench plan -corpus testdata/scenariobench/public-go.json {{.CLI_ARGS}}

  bench-scenario-guards:
    desc: "COSTS TOKENS (targeted tier, ~$20-40 — vision 27 §9). Guards pilot: the fathom-repo invariants corpus, arms full vs control, n=2 (SB-37; testdata/scenariobench/guards-fathom.json is SB-24, another wave)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/guards-fathom.json -trials 2 {{.CLI_ARGS}}

  bench-scenario-guards-adr:
    desc: "COSTS TOKENS (targeted tier, ~$20-40 — vision 27 §9). Guards pilot #2: rules that live only in ADR.md (never repeated in a CLAUDE.md/AGENTS.md), arms full vs control, n=2 (SB-49; testdata/scenariobench/guards-adr.json)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/guards-adr.json -trials 2 {{.CLI_ARGS}}

  bench-scenario-guards-m1:
    desc: "COSTS TOKENS (targeted tier, ~$20-40 — vision 27 §9). Guards pilot #3 (M1 redesign): six rules placed far from their edit site by construction (a package guide, an unnamed-package ADR, a decoy comment, a served-only compiled rule, a three-file docs contract, a commit-message rule); two tasks materialize their own edit-site scaffold via subject.setup rather than committing it here. Arms full vs control, n=3 (RC-50/RC-51; testdata/scenariobench/guards-m1.json)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/guards-m1.json -trials 3 {{.CLI_ARGS}}

  bench-scenario-findings:
    desc: "COSTS TOKENS — findings loop pilot: arms full vs control, n=3 (FL-24; testdata/scenariobench/findings-loop.json). NOT run by this wave: the CLI it exercises (fathom findings import, the pre-edit 'open findings' block) is built by other waves against docs/plans/findings-loop.md sections A-D."
    cmds:
      - GOWORK=off CGO_ENABLED=1 go run ./cmd/scenariobench run -corpus testdata/scenariobench/findings-loop.json -trials 3 {{.CLI_ARGS}}

  bench-scenario-pilot:
    desc: "COSTS TOKENS (pilot tier, ~$90-130 — vision 27 §9). Change-bench pilot over the public Go corpus: arms full vs control, 2 trials, 2 sessions/cell (SB-38)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/public-go.json -trials 2 {{.CLI_ARGS}}

  bench-scenario-lookups-vs:
    desc: "COSTS TOKENS. Lookup pilot vs. the competitors (SB-32/O53): fathom (wired) vs. graphify/serena/gopls/grep over 14 lookup tasks, 2 trials — 140 cells (`task bench-scenario-plan -- -corpus testdata/scenariobench/lookups-vs.json` lists them at no spend; docs/bench/competitors.md pins each tool's install/build/query commands)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/lookups-vs.json -trials 2 {{.CLI_ARGS}}

  fixtures:repin:
    desc: "No spend. Rewrite the bench fixtures' stale line pins (O1153) to where each pin's needle now begins: tasks-home.json kind:line truth_at_head anchors and guards rule.source path#Lnn pins with a rule.needle. Only the quoted pin changes; prose that mentions the old line does not. Run it when TestHomeCorpusTruthAtHead or TestGuardsCorpusDetectorsExist names a stale pin, then review the diff."
    cmds:
      - |
        set -o pipefail
        bash scripts/scratch-home.sh {{.GO}} test ./internal/contextbench ./internal/scenariobench -run '^(TestHomeCorpusTruthAtHead|TestGuardsCorpusDetectorsExist)$' -count=1 -v -args -repin | grep -E 'repinned| is stale|^(ok|FAIL)'

  bench-scenario-lookups-ts:
    desc: "COSTS TOKENS. NOT run this round (SU-23, ADR-041 decision 9). TypeScript lookup pilot on the calibration subject `nest`: fathom (wired) vs. grep over 6 lookup tasks, 2 trials — 24 cells (`task bench-scenario-plan -- -corpus testdata/scenariobench/lookups-ts.json` lists them at no spend)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/lookups-ts.json -trials 2 {{.CLI_ARGS}}

  bench-scenario-lookups-py:
    desc: "COSTS TOKENS. NOT run this round (SU-23, ADR-041 decision 9). Python lookup pilot on the calibration subject `fastapi`: fathom (wired) vs. grep over 6 lookup tasks, 2 trials — 24 cells (`task bench-scenario-plan -- -corpus testdata/scenariobench/lookups-py.json` lists them at no spend)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/scenariobench run -corpus testdata/scenariobench/lookups-py.json -trials 2 {{.CLI_ARGS}}

  bench-compare-edges:
    desc: "Free. Competitor edge comparison (M6/M7): graphify/Serena/gopls precision-recall against the go/types L0 truth, beside fathom's own row (SB-28..31; cmd/indexbench compare is another wave)."
    cmds:
      - GOWORK=off CGO_ENABLED=1 {{.GO}} run ./cmd/indexbench compare {{.CLI_ARGS}}
