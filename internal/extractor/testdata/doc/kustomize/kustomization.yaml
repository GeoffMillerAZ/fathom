apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - ../base
bases:
  - ../legacy
patchesStrategicMerge:
  - replicas.yaml
patches:
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: web
  - inline-patch.yaml
images:
  - name: nginx
    newTag: "1.25"
  - name: example/app
    newName: registry.example/app
