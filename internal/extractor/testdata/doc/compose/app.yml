version: "3.9"
services:
  web:
    image: nginx:1.25
    depends_on:
      - api
      - cache
  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./worker
  db:
    image: postgres:16
  cache:
    image: redis:7
volumes:
  data: {}
