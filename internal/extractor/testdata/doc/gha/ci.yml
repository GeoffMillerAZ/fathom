name: CI
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint
  test:
    runs-on: [ubuntu-latest, self-hosted]
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
  release:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: ./.github/actions/publish
