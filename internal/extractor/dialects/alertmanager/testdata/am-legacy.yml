# The deprecated match and match_re forms; claimed by content (its name is
# not alertmanager.yml).
route:
  receiver: default
  routes:
    - match:
        service: api
        severity: page
      receiver: api-pager
    - match_re:
        service: ^(foo|bar)$
      receiver: foobar
      routes:
        - match: {owner: team-x}
          receiver: team-x
receivers:
  - name: default
  - name: api-pager
    victorops_configs:
      - api_key: not-a-real-secret
        routing_key: api
  - name: foobar
  - name: team-x
inhibit_rules:
  - source_match: {severity: critical}
    target_match_re: {severity: warning|info}
    equal: [service]
