// A project build script: plugins and declared dependencies.
buildscript {
    dependencies {
        classpath 'org.example:build-helper:2.1'
    }
}

plugins {
    id 'java-library'
    id "org.example.conventions" version "3.0" apply false
    id('org.example.quality')
}

apply plugin: 'maven-publish'
apply(plugin: 'signing')
apply plugin: org.example.CustomPlugin

dependencies {
    api project(':lib')
    implementation(project(":core:util"))
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation("com.google.guava:guava:33.0-jre") {
        exclude group: 'com.google.code.findbugs'
    }
    testImplementation "junit:junit:${junitVersion}"
    implementation platform(project(':platform'))
    api(enforcedPlatform('org.example:bom:1.0'))
    testImplementation(testFixtures(project(':lib')))
    implementation libs.commons.lang
    runtimeOnly group: 'org.example', name: 'runtime', version: '1.0'
    compileOnly files('libs/local.jar')
    constraints {
        implementation 'org.example:constrained:1.1'
    }
}
