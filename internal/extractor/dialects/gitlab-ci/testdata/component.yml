spec:
  inputs:
    stage:
      default: test
    go_version:
      default: "1.25"
---
"lint-$[[ inputs.go_version ]]":
  stage: $[[ inputs.stage ]]
  script:
    - golangci-lint run

pages:
  stage: deploy
  script:
    - mkdir public
  artifacts:
    paths:
      - public

cache:
  key: shared
  paths:
    - vendor/

image: alpine

before_script:
  - echo start

services:
  - postgres:16

types: [test]
