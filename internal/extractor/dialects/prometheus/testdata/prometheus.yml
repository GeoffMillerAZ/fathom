global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - checkout.rules.yml
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: checkout
    metrics_path: /metrics
    static_configs:
      - targets:
          - checkout:8080
          - checkout-canary:8080
        labels:
          env: prod
      - targets: ["10.0.0.7:9100"]

  - job_name: "node"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
