apiVersion: 1
groups:
  - orgId: 1
    name: checkout.1m
    folder: Shop
    interval: 1m
    rules:
      - uid: checkout-latency
        title: CheckoutHighLatency
        condition: B
        annotations:
          __dashboardUid__: checkout-overview
          __panelId__: "2"
        data:
          - refId: A
            datasourceUid: webstore-metrics
            model:
              datasource: {type: prometheus, uid: webstore-metrics}
              expr: histogram_quantile(0.95, sum by (le) (job:latency_bucket:rate5m))
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
        notification_settings:
          receiver: shop-email
contactPoints:
  - orgId: 1
    name: shop-email
    receivers:
      - uid: shop-email-1
        type: email
        settings:
          addresses: oncall@example.org
      - uid: shop-slack-1
        type: slack
        settings:
          url: https://hooks.example.org/services/T2/B2/X2
          token: not-a-real-secret
policies:
  - orgId: 1
    receiver: shop-email
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: shop-email
        object_matchers: [[severity, =, critical]]
        mute_time_intervals: [weekends]
muteTimes:
  - orgId: 1
    name: weekends
    time_intervals:
      - weekdays: [saturday, sunday]
templates:
  - orgId: 1
    name: shop.title
    template: '{{ define "shop.title" }}{{ .CommonLabels.alertname }}{{ end }}'
