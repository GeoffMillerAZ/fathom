stream {
    upstream dns_servers {
        server 192.168.0.1:53;
        server dns.example.net:53;
    }

    server {
        listen 53 udp;
        proxy_pass dns_servers;
    }

    server {
        listen 3306;
        proxy_pass mysql:3306;
    }
}

http {
    server {
        listen 80;
        location / {
            proxy_pass http://$backend_host;
        }
    }
