# app.conf — a conf.d fragment
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name "";
    include snippets/common.conf;

    location /static/ {
        alias /srv/static/;
        location ~ "\.(js|css){1}$" {
            expires 7d;
        }
    }

    location /ws {
        if ($http_upgrade = "websocket") {
            proxy_pass http://ws.example.com.svc:7000;
        }
        content_by_lua_block {
            local t = { a = "}" }  -- a brace in a string
            ngx.say("{")
        }
    }

    location /grpc {
        grpc_pass grpc://orders:50051;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
    }
}
