global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http-in
    bind *:80
    acl is_api path_beg /api
    acl is_api path_beg /v2   # a second line for one acl
    acl host_admin hdr(host) -i admin.example.com
    use_backend api_servers if is_api
    use_backend admin if host_admin
    use_backend %[req.hdr(host),lower,map(/etc/haproxy/hosts.map)]
    default_backend web_servers

backend api_servers
    balance roundrobin
    server api1 api:8080 check
    server api2 10.0.0.21:8080 check backup

backend web_servers
    server web1 web:80 check inter 2s
    server-template web 3 web.service.consul:80 check

listen stats
    bind *:8404
    stats enable
    server local unix@/var/run/stats.sock
