# edge proxy
frontend "fe main"
    bind :443 ssl crt /etc/ssl/site.pem
    acl is_static path_end .css .js # trailing comment
    acl has_hash path_reg ^/a\#b$
    http-request set-header X-Forwarded-Proto "https"
    use_backend 'be static' if is_static
    default_backend be_app

backend 'be static'
    server s1 "static.internal:8080"

backend be_app
    server app1 ${APP_HOST}:3000
    server app2 [2001:db8::1]:3000
