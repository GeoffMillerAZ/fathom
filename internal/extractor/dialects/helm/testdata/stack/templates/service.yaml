apiVersion: v1
kind: Service
metadata:
  name: {{ include "stack.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range $name, $port := .Values.service.ports }}
    - name: {{ $name }}
      port: {{ $port.port }}
    {{- end }}
  selector:
    {{- include "stack.selectorLabels" . | nindent 4 }}
{{- if .Values.ingress.enabled }}
{{ template "stack.ingress" . }}
{{- end }}
