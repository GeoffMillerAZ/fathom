apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stack.fullname" . }}
  labels:
    {{- include "stack.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stack.selectorLabels" . | nindent 6 }}
  template:
    spec:
      serviceAccountName: {{ include "stack.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: TLS
              value: {{ (index .Values "tls-config").mode }}
              {{ $.Values.global.region }} {{ tpl .Values.extraArgs $ }} {{ .Values.a.b.c.d }}
