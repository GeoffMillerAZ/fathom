apiVersion: v2
name: stack
description: An application chart with three dependencies
type: application
version: 1.4.0
appVersion: "2.1.0"
dependencies:
  - name: common
    version: 2.x.x
    repository: file://../common
  - name: redis
    version: 19.6.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: postgresql
    version: 15.5.0
    repository: https://charts.example.test
    alias: db
