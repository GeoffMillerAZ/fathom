# A single crate with every target table, features and every dependency form.
[package]
name = "acme-core"
version = "1.4.2"
edition = "2021"
description = "core of the acme toolkit"

[lib]
name = "acme_core"
path = "src/core.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "acme"
path = "src/bin/acme.rs"
required-features = ["cli"]

[[bin]]
name = "acme-admin"
path = "src/bin/admin.rs"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[test]]
name = "integration"
harness = false

[[bench]]
name = "throughput"
harness = false

[features]
default = ["std", "cli"]
std = ["alloc", "serde?/std"]
alloc = []
cli = ["dep:clap", "dep:acme-log"]
serde = ["dep:serde"]

[dependencies]
acme-log = { path = "../acme-log", version = "0.3", optional = true }
clap = { version = "4", optional = true, default-features = false }
serde = { version = "1", optional = true }
log = "0.4"
rand_core = { version = "0.6", package = "rand_core_next" }

[dependencies.bytes]
version = "1"

[dev-dependencies]
acme-testkit = { path = "../acme-testkit" }
criterion = "0.5"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
winapi = "0.3"

[package.metadata.docs.rs]
all-features = true

[profile.release]
lto = true
