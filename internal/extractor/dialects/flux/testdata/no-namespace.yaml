# Objects with no metadata.namespace (applied with `kubectl -n`): named Kind/name.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: tenant-repo
  path: ./tenants/one
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenant-repo
spec:
  interval: 1m
  url: https://git.example.com/org/tenant.git
