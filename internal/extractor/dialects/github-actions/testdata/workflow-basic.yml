name: CI
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        run: golangci-lint run
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - id: setup
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test
        run: go test ./...
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - id: build-step
        name: Build
        run: go build ./...
