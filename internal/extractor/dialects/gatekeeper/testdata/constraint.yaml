apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: all-must-have-owner
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace", "Pod"]
      - apiGroups: ["apps", "extensions"]
        kinds: ["Deployment"]
    namespaces: ["prod", "team-*"]
    labelSelector:
      matchLabels:
        owner-required: "true"
  parameters:
    labels: ["owner"]
