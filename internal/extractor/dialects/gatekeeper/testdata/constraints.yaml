# Two constraints in one stream: one by selector alone, one matching everything.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: repos-by-label
spec:
  match:
    labelSelector:
      matchLabels:
        team: payments
  parameters:
    repos: ["registry.example.com/"]
---
apiVersion: constraints.gatekeeper.sh/v1
kind: K8sBlockNodePort
metadata:
  name: block-node-port
spec:
  match:
    kinds:
      - apiGroups: ["*"]
        kinds: ["*"]
