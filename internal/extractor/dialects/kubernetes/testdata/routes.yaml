apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
spec:
  selector:
    app: orders
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: shop
spec:
  defaultBackend:
    service:
      name: web
      port:
        number: 80
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 8080
          - path: /assets
            pathType: Prefix
            backend:
              resource:
                apiGroup: k8s.example.com
                kind: StorageBucket
                name: assets
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: legacy
spec:
  backend:
    serviceName: fallback
    servicePort: 80
  rules:
    - http:
        paths:
          - path: /
            backend:
              serviceName: orders
              servicePort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-route
  namespace: shop
spec:
  parentRefs:
    - name: acme-gateway
  rules:
    - backendRefs:
        - name: orders
          port: 8080
        - name: orders-canary
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: billing-grpc
spec:
  rules:
    - backendRefs:
        - name: billing
          port: 9090
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: orders
  namespace: shop
spec:
  hosts:
    - orders
  http:
    - route:
        - destination:
            host: orders
            subset: v1
          weight: 90
        - destination:
            host: orders.shop.svc.cluster.local
            subset: v2
          weight: 10
  tcp:
    - route:
        - destination:
            host: ledger.finance
  tls:
    - route:
        - destination:
            host: api.example.com
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: orders
  namespace: shop
spec:
  host: orders
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: acme-gateway
  namespace: shop
spec:
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "shop/shop.example.com"
        - "*"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard
  namespace: shop
spec:
  routes:
    - match: Host(`dash.example.com`)
      kind: Rule
      services:
        - name: dashboard
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: db
  namespace: shop
spec:
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postgres
          port: 5432
