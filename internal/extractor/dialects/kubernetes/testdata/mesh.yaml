apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: payments-api
  namespace: shop
spec:
  hosts:
    - api.payments.example.com
    - "*.cdn.example.com"
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: https
      protocol: TLS
  endpoints:
    - address: egress-proxy.shop.svc.cluster.local
    - address: 10.20.0.7
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: storefront
  namespace: monitoring
spec:
  jobName: storefront-http
  prober:
    url: blackbox-exporter.monitoring.svc:19115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - http://orders.shop.svc:8080/healthz
        - https://shop.example.com
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-rules
  namespace: monitoring
spec:
  groups:
    - name: shop.rules
      rules:
        - alert: OrdersDown
          expr: up{job="orders", namespace="shop"} == 0
        - record: job:http_requests:rate5m
          expr: sum by (job) (rate(http_requests_total{job="checkout"}[5m]))
        - alert: AnyDown
          expr: up{job=~"orders|checkout"} == 0
