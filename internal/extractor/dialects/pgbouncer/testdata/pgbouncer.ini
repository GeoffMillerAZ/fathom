;; Example PgBouncer configuration written for this dialect's fixtures.
[databases]
; plain entries
app = host=db1.example.test port=5433 dbname=appdb user=app_rw
reports = host=db2.example.test dbname=reports pool_size=5 auth_dbname=authdb
authdb = host=db1.example.test dbname=postgres auth_user=pgb_auth
quoted = host=db1.example.test dbname='odd name' connect_query='SET x = 1'
* = host=fallback.example.test

[users]
batch = pool_mode=transaction max_user_connections=4

[peers]
1 = host=/tmp/pgbouncer1 port=6432
2 = host=pgb2.example.test

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_dbname = authdb
pool_mode = session
