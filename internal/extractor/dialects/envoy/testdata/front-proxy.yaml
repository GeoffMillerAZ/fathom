static_resources:
  listeners:
  - name: ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - name: service-one
                match:
                  prefix: "/service/1"
                route:
                  cluster: service1
              - match:
                  path: "/healthz"
                route:
                  cluster: service2
              - match:
                  safe_regex:
                    regex: "/api/v[0-9]+/.*"
                route:
                  weighted_clusters:
                    clusters:
                    - name: service1
                      weight: 90
                    - name: service2
                      weight: 10
              - match:
                  prefix: "/missing"
                route:
                  cluster: service2
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 8443
    filter_chains: [{filters: [{name: envoy.filters.network.tcp_proxy, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: tcp, cluster: service1}}]}]
  clusters:
  - name: service1
    type: STRICT_DNS
    load_assignment:
      cluster_name: service1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: service-envoy-1.example.com
                port_value: 8000
        - endpoint:
            address:
              socket_address:
                address: 10.0.0.7
                port_value: 8000
  - name: service2
    type: STRICT_DNS
    load_assignment:
      cluster_name: service2
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: {address: legacy-backend, port_value: 9000}
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 8001
