# TL-5 (ADR-062) and TL-9 (K20): the telemetry identities a compose file
# declares: OTEL_SERVICE_NAME, NEW_RELIC_APP_NAME (its first name) and
# OTEL_RESOURCE_ATTRIBUTES' service.name, in the map and the list form, one
# per name in the file. A value decided at deploy time (an interpolation)
# yields none, and so does a list element with no value.
services:
  checkout:
    image: shop/checkout:1.4
    environment:
      OTEL_SERVICE_NAME: checkout-api
      NEW_RELIC_APP_NAME: "Checkout (prod);Checkout"
      OTEL_RESOURCE_ATTRIBUTES: service.name=checkout-api,deployment.environment=prod
  worker:
    image: shop/worker:1.4
    environment:
      - OTEL_SERVICE_NAME=order-worker
  templated:
    image: shop/templated:1.4
    environment:
      OTEL_SERVICE_NAME: ${SERVICE_NAME:-templated}
  cart:
    image: shop/cart:2.0
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod,service.name=cart-svc
  ledger:
    image: shop/ledger:2.0
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=ledger-svc,team=payments
      - NEW_RELIC_APP_NAME=Ledger;Payments
  billing:
    image: shop/billing:2.0
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=team=payments,service.name=billing-svc
      - OTEL_SERVICE_NAME=${BILLING_NAME}
      - NEW_RELIC_APP_NAME
  search:
    image: shop/search:2.0
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=$(SEARCH_NAME)
