# grep-group (design §17, §6.7): grep, rg and git grep matches grouped by
# file, the path factored out to one header (lossless: ungrouping restores
# the bytes). Above 200 matches, a per-file cap of 20 lines, each capped file
# followed by a note with how many lines it hid and the file's count; the
# receipt counts every match and file. Counts come from the harness's
# persisted output when the caller read it, else they are labelled as over
# the shown text and never presented as totals. -c, -l, -L, -o, -Z and a
# pipe into a non-display consumer stay raw (the classifier's machine-bound
# shapes). Recovery: repeat the search. Ships in observe.
#
# git grep is its own rule here: a rule's match.sub would read grep's
# pattern as a subcommand, so one matcher cannot carry both.
schema = 1

[[rule]]
id = "grep-group"
version = 1
about = "grep and rg: matches grouped by file, the path factored out; above 200 matches a per-file cap with counts"
match.argv0 = ["grep", "egrep", "fgrep", "rg"]
match.compound = "display_tail"
mode = "observe"
recovery = "repeat"

[[rule.stage]]
kind = "extract"
pattern = '^[^:\s]*[/.][^:\s]*:'
key = '^[^:\s]*[/.][^:\s]*:'
record = "grep_match"
template = "{count} matches in {groups} files"

[[rule.stage]]
kind = "cap"
key = '^[^:\s]*[/.][^:\s]*:'
per_group = 20
above = 200

[[rule.stage]]
kind = "group"
key = '^[^:\s]*[/.][^:\s]*:'

# Under the cap: grouped, nothing dropped; a content stream, so the error
# words and path:line prefixes are data.
[[rule.test]]
input = """
internal/cart/total.go:12:	if err != nil {
internal/cart/total.go:19:		return 0, fmt.Errorf("total: %w", err)
internal/cart/errors.go:3:// errors returned by the cart
cmd/shop/main.go:41:	log.Fatal(err)
cmd/shop/main.go:57:	log.Fatal(err)
"""
expect = """
internal/cart/total.go:
  12:	if err != nil {
  19:		return 0, fmt.Errorf("total: %w", err)
internal/cart/errors.go:3:// errors returned by the cart
cmd/shop/main.go:
  41:	log.Fatal(err)
  57:	log.Fatal(err)
[readout grep-group@1 observe: 5→7 lines; nothing dropped; 5 matches in 3 files, 0 dropped]
"""

# Above the cap: path:line and error-word lines dropped with no trip, every
# file named with its count.
[[rule.test]]
input_file = "grep-group-over-cap.txt"
expect = '''
